name: Daily Film Post

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post film of the day
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHANNEL: '@genopoisk_news'
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, random, os, html as html_lib

          tg_token = os.environ['TG_TOKEN']
          channel = os.environ['CHANNEL']
          base_url = 'https://genopoisk.vercel.app'

          # 1. Fetch top films
          print('Fetching films...')
          try:
              with urllib.request.urlopen(f'{base_url}/api/kinopoisk?q=v2.2/films/top&type=TOP_250_BEST_FILMS&page=1', timeout=15) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f'❌ Failed to fetch films: {e}'); exit(1)

          films = data.get('films', [])
          if not films:
              print('No films found!'); exit(1)

          # 2. Pick random film
          film = random.choice(films)
          film_id = film.get('filmId')
          title = html_lib.escape(film.get('nameRu') or film.get('nameEn') or 'Без названия')
          rating = film.get('rating', '')
          year = film.get('year', '')
          poster = film.get('posterUrlPreview') or film.get('posterUrl', '')
          print(f'Selected: {title} ({year}) rating={rating}')

          # 3. Fetch film details
          genres = ''
          description = ''
          try:
              with urllib.request.urlopen(f'{base_url}/api/kinopoisk?q=v2.2/films/{film_id}') as resp:
                  detail = json.loads(resp.read())
              genres = html_lib.escape(', '.join([g['genre'] for g in detail.get('genres', [])[:3]]))
              description = html_lib.escape((detail.get('shortDescription') or detail.get('description') or '')[:200])
              if len(description) == 200: description += '...'
              if not rating or rating == 'null': rating = detail.get('ratingKinopoisk', '')
          except Exception as e:
              print(f'Details fetch failed: {e}')

          # 4. Build caption
          caption = f'🎬 <b>Фильм дня</b>\n\n📺 <b>{title}</b>\n'
          meta_parts = []
          if year and year != 'null': meta_parts.append(f'📅 {year}')
          if genres: meta_parts.append(f'🎭 {genres}')
          if rating and rating != 'null' and rating != '0': meta_parts.append(f'⭐ {rating}')
          if meta_parts: caption += ' · '.join(meta_parts) + '\n'
          if description: caption += f'\n{description}\n'
          caption += f'\n▶ <b>Смотреть:</b> @Genopoiskbot'

          # 5. Build keyboard
          keyboard = {"inline_keyboard": [[
              {"text": "▶ Смотреть фильм", "url": f"https://t.me/Genopoiskbot?start=film_{film_id}"},
              {"text": "🌐 Открыть сайт", "url": "https://genopoisk.vercel.app/"}
          ]]}

          # 6. Send to channel
          if poster:
              payload = {"chat_id": channel, "photo": poster, "caption": caption, "parse_mode": "HTML", "reply_markup": keyboard}
              api_method = 'sendPhoto'
          else:
              payload = {"chat_id": channel, "text": caption, "parse_mode": "HTML", "reply_markup": keyboard}
              api_method = 'sendMessage'

          print(f'Sending {api_method}...')
          try:
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{tg_token}/{api_method}',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST'
              )
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  if result.get('ok'):
                      print(f'✅ Posted! Message ID: {result["result"]["message_id"]}')
                  else:
                      print(f'❌ Failed: {result}'); exit(1)
          except urllib.error.HTTPError as e:
              print(f'❌ HTTP Error: {e.code} {e.reason}')
              print(e.read().decode()); exit(1)
          except Exception as e:
              print(f'❌ Error: {e}'); exit(1)
          PYEOF
