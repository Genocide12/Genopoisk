<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, minimum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genopoisk">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="shortcut icon" type="image/png" href="/icon-192.png">
  <title>Genopoisk</title>
  <script>
    // ====== Performance & error logging ======
    window.addEventListener('DOMContentLoaded', function() {
      console.log('[perf] DOMContentLoaded at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('load', function() {
      console.log('[perf] Window load at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('error', function(e) {
      console.error('[error]', e.message, e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[unhandled rejection]', e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script async src="https://telegram.org/js/telegram-web-app.js" onerror="console.log('[tg] telegram-web-app.js unavailable (running outside Telegram Mini App — this is normal)')"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{--ios-blue:#007AFF;--ios-purple:#5856D6;--ios-pink:#FF2D55;}
    body{--bg-primary:#000;--bg-secondary:#1C1C1E;--bg-tertiary:#2C2C2E;--text-primary:#FFF;--text-secondary:#98989D;--separator:rgba(84,84,88,0.6);--fill:rgba(120,120,128,0.2);--fill-secondary:rgba(120,120,128,0.16);--fill-tertiary:rgba(118,118,128,0.12);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
    body.light-theme{--bg-primary:#F2F2F7;--bg-secondary:#FFF;--bg-tertiary:#F2F2F7;--text-primary:#000;--text-secondary:#6E6E73;--separator:rgba(60,60,67,0.29);}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px;}
    .hero{text-align:center;padding:40px 20px;margin-bottom:32px;position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,rgba(0,122,255,0.15) 0%,rgba(88,86,214,0.15) 50%,rgba(255,45,85,0.15) 100%);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--separator);box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);}
    .hero-title{font-size:clamp(32px,6vw,48px);font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#007AFF 0%,#5856D6 50%,#FF2D55 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.03em;line-height:1.1;cursor:pointer;user-select:none;transition:transform 0.2s;}
    .hero-title:active{transform:scale(0.98);}
    .hero-subtitle{font-size:clamp(14px,2vw,17px);color:var(--text-secondary);font-weight:500;letter-spacing:-0.01em;}
    .search-wrapper{margin-bottom:24px;}
    .search-container{position:relative;max-width:600px;margin:0 auto;}
    .search-input{width:100%;padding:14px 20px 14px 44px;font-size:17px;font-weight:500;background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:16px;color:var(--text-primary);outline:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);font-family:inherit;}
    .search-input::placeholder{color:var(--text-secondary);}
    .search-input:focus{background:var(--bg-tertiary);border-color:var(--ios-blue);box-shadow:0 0 0 4px rgba(0,122,255,0.2);transform:translateY(-2px);}
    .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none;opacity:0.6;}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.18);border:none;color:var(--text-primary);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1;-webkit-tap-highlight-color:transparent;}
    .search-clear.visible{display:flex;}
    .search-clear:active{background:rgba(255,255,255,0.32);transform:translateY(-50%) scale(0.92);}
    /* Make room for the clear button when visible */
    .search-input{padding-right:44px;}
    .search-input:not(:placeholder-shown) ~ .search-clear{display:flex;}
    .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px;}
    .action-card{position:relative;background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:20px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
    .action-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--ios-blue);box-shadow:0 12px 40px rgba(0,122,255,0.3);}
    .action-card:active{transform:scale(0.96);}
    .action-icon{font-size:40px;margin-bottom:8px;display:block;filter:drop-shadow(0 4px 12px rgba(0,122,255,0.3));}
    .action-title{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em;}
    .content{background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:24px;padding:24px;min-height:400px;margin-bottom:32px;position:relative;overflow:hidden;}
    .content.hidden{display:none;}
    .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-primary);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);z-index:10;}
    .loader.hidden{display:none;}
    .spinner{width:44px;height:44px;border:3px solid var(--fill);border-top-color:var(--ios-blue);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loader-text{font-size:15px;font-weight:500;color:var(--text-secondary);letter-spacing:-0.01em;}
    .film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
    .film-grid.centered {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      min-height:300px;
    }
    .film-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);background:var(--bg-secondary);}
    .film-card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 20px 60px rgba(0,122,255,0.4);z-index:2;}
    .film-poster {width: 140px;height:210px;object-fit:cover;background: linear-gradient(135deg,var(--bg-secondary) 0%,var(--bg-tertiary) 100%);display: block;margin: 0 auto;}
    .film-info{padding:12px;background:linear-gradient(to top,var(--bg-secondary) 0%,transparent 100%);}
    .film-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.01em;}
    .film-meta{font-size:12px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px;}
    .rating{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;background:rgba(0,122,255,0.2);border-radius:6px;font-weight:600;color:var(--ios-blue);}
    .empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}
    .empty-icon{font-size:64px;margin-bottom:16px;opacity:0.4;filter:grayscale(1);}
    .empty-text{font-size:17px;font-weight:500;letter-spacing:-0.01em;}
    .resume-card{display:none;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(0,122,255,0.18) 0%,rgba(88,86,214,0.18) 100%);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:20px;padding:14px 16px;margin-bottom:24px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;}
    .resume-card:hover{transform:translateY(-2px);border-color:var(--ios-blue);box-shadow:0 12px 36px rgba(0,122,255,0.3);}
    .resume-card:active{transform:scale(0.99);}
    .resume-icon{font-size:32px;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,122,255,0.4));}
    .resume-info{flex:1;min-width:0;}
    .resume-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
    .resume-title{font-size:16px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em;}
    .resume-meta{font-size:12px;color:var(--text-secondary);margin-top:2px;}
    .resume-close{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(120,120,128,0.3);color:var(--text-primary);border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:all 0.2s;}
    .resume-close:hover{background:rgba(255,45,85,0.4);}
    .resume-close:active{transform:scale(0.9);}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    .resume-card.visible{display:flex;animation:slideDown 0.3s ease;}
    .footer{text-align:center;padding:32px 20px;margin-top:40px;border-top:1px solid var(--separator);}
    .footer-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:8px;letter-spacing:-0.01em;}
    .footer-text{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;}
    .footer-link{display:inline-block;padding:8px 16px;background:var(--fill);border:1px solid var(--separator);border-radius:12px;color:var(--ios-blue);text-decoration:none;font-size:14px;font-weight:600;transition:all 0.3s;}
    .footer-link:hover{background:var(--ios-blue);color:white;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,122,255,0.4);}
    .tg-login-bar{display:none;justify-content:center;align-items:center;background:var(--fill);border:1px solid var(--separator);border-radius:16px;padding:14px 16px;margin-bottom:16px;}
    .tg-login-bar.visible{display:flex;}
    #tgWidgetContainer{display:flex;justify-content:center;overflow:hidden;}
    #tgWidgetContainer iframe{max-width:100%;border:none;overflow:hidden;}
    @media (max-width:768px){.container{padding:16px 12px;}.hero{padding:32px 16px;margin-bottom:24px;}.actions{grid-template-columns:repeat(2,1fr);}.film-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
    @media (max-width:480px){.hero-title{font-size:28px;}.action-icon{font-size:32px;}.film-grid{gap:10px;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="tg-login-bar" id="tgLoginBar">
      <!-- State A: not logged in — show only login button -->
      <div class="tg-login-state" id="tgLoginStateLoggedOut">
        <a href="/api/auth/telegram/login" id="tgLoginBtn" style="background:#229ED9;color:#fff;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          Войти через Telegram
        </a>
      </div>
      <!-- State B: logged in — show "Open in Telegram" with close ✕ -->
      <div class="tg-login-state" id="tgLoginStateLoggedIn" style="display:none;align-items:center;gap:10px;">
        <a href="https://t.me/Genopoiskbot?start=app" target="_blank" rel="noopener" style="background:linear-gradient(135deg,#229ED9 0%,#2AABEE 100%);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,0.2);">
          <span style="font-size:16px;">🤖</span>
          Открыть в Telegram
        </a>
        <button id="tgLoginBarClose" title="Скрыть" style="background:rgba(255,255,255,0.15);border:none;color:var(--text-primary);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;-webkit-tap-highlight-color:transparent;">✕</button>
      </div>
    </div>
    <div class="hero">
      <h1 class="hero-title" onclick="toggleTheme()" title="Нажмите для смены темы">Genopoisk</h1>
      <p class="hero-subtitle">Кинотеатр в твоем кармане</p>
    </div>
    <div class="resume-card" id="resumeCard">
      <span class="resume-icon">▶️</span>
      <div class="resume-info">
        <div class="resume-label">Продолжить просмотр</div>
        <div class="resume-title" id="resumeTitle">—</div>
        <div class="resume-meta" id="resumeMeta">—</div>
      </div>
      <button class="resume-close" id="resumeClose" title="Скрыть">✕</button>
    </div>
    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" class="search-input" placeholder="Поиск фильмов..." autocomplete="off" enterkeyhint="done" inputmode="search" />
        <button class="search-clear" id="searchClear" type="button" title="Очистить">✕</button>
      </div>
    </div>
    <div class="actions">
      <div class="action-card" onclick="loadCategory('popular')">
        <span class="action-icon">🔥</span>
        <div class="action-title">Популярные</div>
      </div>
      <div class="action-card" onclick="loadCategory('top250')">
        <span class="action-icon">⭐</span>
        <div class="action-title">Топ 250</div>
      </div>
      <div class="action-card" onclick="loadCategory('new')">
        <span class="action-icon">🎬</span>
        <div class="action-title">Новинки</div>
      </div>
      <div class="action-card" onclick="loadCategory('random')">
        <span class="action-icon">🎯</span>
        <div class="action-title">Случайный</div>
      </div>
      <div class="action-card" onclick="loadFavorites()">
        <span class="action-icon">❤️</span>
        <div class="action-title">Избранное</div>
      </div>
    </div>
    <div class="content hidden" id="content">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Загрузка...</div>
      </div>
      <div class="film-grid" id="filmGrid"></div>
    </div>
    </div>
  <script>
    // Защита от копирования / инспектора
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.onkeydown = function(e) {
      const key = e.key || '';
      if (e.ctrlKey && (key === 'c' || key === 'C' || key === 'x' || key === 'X' || key === 'u' || key === 'U' || key === 's' || key === 'S')) {
        e.preventDefault();
        return false;
      }
      if (key === 'F12') {
        e.preventDefault();
        return false;
      }
    };

    const API_BASE = '/api/kinopoisk'; // server-side proxy hides the API key

    // --- Telegram WebApp init (MUST run BEFORE getBrowserUserId) ---
    // We need to extract TG user ID from initData and store it in localStorage
    // BEFORE getBrowserUserId() reads it, so profiles are linked.
    let tgInitData = '';
    let tg = null;
    function initTelegramWebApp() {
      tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return null;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
      } catch (_) {}
      tgInitData = tg.initData || '';
      if (tgInitData) {
        try {
          const params = new URLSearchParams(tgInitData);
          const userJson = params.get('user');
          if (userJson) {
            const u = JSON.parse(userJson);
            localStorage.setItem('genopoisk_tg_user_id', String(u.id));
            if (u.username) localStorage.setItem('genopoisk_tg_username', u.username);
            console.log('[tg] Linked TG user ID:', u.id, 'username:', u.username);
          }
        } catch (_) {}
      }
      console.log('[tg] Telegram WebApp initialized, has initData:', !!tgInitData);
      return tg;
    }
    // Try immediately — in Telegram Mini App, telegram-web-app.js is already loaded
    tg = initTelegramWebApp();

    // --- User identification ---
    // Priority: 1) Stored TG user ID (from previous Telegram visit, in localStorage)
    //           2) Stable localStorage web_ ID (persists across VPN changes)
    function getBrowserUserId() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) {
        console.log('[user] Using stored TG ID:', tgId);
        return tgId;
      }
      let id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        const rand = Math.random().toString(36).slice(2, 11);
        const time = Date.now().toString(36);
        id = `web_${time}_${rand}`;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }
    // DYNAMIC userId — re-reads localStorage EVERY TIME (not a const!)
    // This fixes the core bug: telegram-web-app.js loads async and stores
    // TG user ID in localStorage AFTER getBrowserUserId() was first called.
    // With a const, all subsequent trackEvent calls used the old web_ ID.
    function getUserId() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) return tgId;
      let id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        const rand = Math.random().toString(36).slice(2, 11);
        const time = Date.now().toString(36);
        id = `web_${time}_${rand}`;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }

    // --- Telegram OIDC Login bar ---
    // Two states:
    //   A) Not logged in → show "Войти через Telegram" (login button)
    //   B) Logged in → show "Открыть в Telegram" (link to bot) + ✕ close button
    // User can dismiss state B with ✕ — it remembers the dismissal in
    // sessionStorage so it stays hidden during the browsing session.
    // In Mini App (running inside Telegram already) the bar is hidden entirely.
    const tgLoginBar = document.getElementById('tgLoginBar');
    const tgLoginStateLoggedOut = document.getElementById('tgLoginStateLoggedOut');
    const tgLoginStateLoggedIn = document.getElementById('tgLoginStateLoggedIn');
    const tgLoginBarCloseBtn = document.getElementById('tgLoginBarClose');

    function checkTgLoginBar() {
      const isInTelegram = !!(tg && tg.initData);
      const storedTgId = localStorage.getItem('genopoisk_tg_user_id');
      const storedTgUsername = localStorage.getItem('genopoisk_tg_username');
      const isLoggedIn = !!(storedTgId || storedTgUsername);

      // In Mini App — hide entire bar (user is already in Telegram)
      if (isInTelegram) {
        tgLoginBar.classList.remove('visible');
        return;
      }

      // Check if user dismissed the "Open in Telegram" bar this session
      const dismissed = sessionStorage.getItem('genopoisk_tg_bar_dismissed') === '1';

      if (!isLoggedIn) {
        // State A: show login button
        tgLoginStateLoggedOut.style.display = '';
        tgLoginStateLoggedIn.style.display = 'none';
        tgLoginBar.classList.add('visible');
      } else if (dismissed) {
        // User closed the bar this session — keep it hidden
        tgLoginBar.classList.remove('visible');
      } else {
        // State B: show "Open in Telegram" + close button
        tgLoginStateLoggedOut.style.display = 'none';
        tgLoginStateLoggedIn.style.display = 'flex';
        tgLoginBar.classList.add('visible');
      }
    }

    if (tgLoginBarCloseBtn) {
      tgLoginBarCloseBtn.addEventListener('click', function() {
        sessionStorage.setItem('genopoisk_tg_bar_dismissed', '1');
        tgLoginBar.classList.remove('visible');
      });
    }
    // DON'T call checkTgLoginBar yet — wait for telegram-web-app.js to load
    // (it's async, so tg might be null on first run even in Mini App)

    // Check for ?telegram_login=success&tg_id=... (from OAuth callback redirect)
    const urlParams = new URLSearchParams(window.location.search);
    const telegramLogin = urlParams.get('telegram_login');
    const tgIdFromUrl = urlParams.get('tg_id');
    const tgNameFromUrl = urlParams.get('tg_name');
    const tgUsernameFromUrl = urlParams.get('tg_username');

    if (telegramLogin === 'success' && tgIdFromUrl) {
      // OAuth success — store user data
      localStorage.setItem('genopoisk_tg_user_id', String(tgIdFromUrl));
      if (tgNameFromUrl) localStorage.setItem('genopoisk_tg_user_name', tgNameFromUrl);
      if (tgUsernameFromUrl) localStorage.setItem('genopoisk_tg_username', tgUsernameFromUrl);
      console.log('[tg] OIDC login successful, TG ID:', tgIdFromUrl, 'username:', tgUsernameFromUrl);
      // Clean URL
      history.replaceState(null, '', window.location.pathname);
      window.location.reload();
    } else if (telegramLogin === 'error') {
      const msg = urlParams.get('message') || 'unknown';
      console.error('[tg] OIDC login error:', msg);
      history.replaceState(null, '', window.location.pathname);
    }

    // Also handle ?tg_id= (fallback from bot deep link)
    if (tgIdFromUrl && !telegramLogin) {
      localStorage.setItem('genopoisk_tg_user_id', String(tgIdFromUrl));
      if (tgNameFromUrl) localStorage.setItem('genopoisk_tg_user_name', tgNameFromUrl);
      console.log('[tg] Linked via bot, TG ID:', tgIdFromUrl);
      history.replaceState(null, '', window.location.pathname);
      window.location.reload();
    }

    // --- Check if user still exists in stats (after "logout all devices") ---
    async function checkAuth() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      const tgUsername = localStorage.getItem('genopoisk_tg_username');
      if (!tgId && !tgUsername) return; // not logged in at all
      if (tg && tg.initData) return; // Mini App — always authenticated
      try {
        const res = await fetch('/api/user-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: tgId, username: tgUsername, initData: getTgInitData() })
        });
        const data = await res.json();
        if (data.reauth) {
          console.log('[auth] User not found, clearing localStorage');
          localStorage.removeItem('genopoisk_tg_user_id');
          localStorage.removeItem('genopoisk_tg_user_name');
          localStorage.removeItem('genopoisk_tg_username');
          window.location.reload();
        }
      } catch (e) { console.warn('[auth] check failed:', e); }
    }

    // --- Wait for telegram-web-app.js to load, then init everything ---
    // This ensures tg is available before checkTgLoginBar and checkAuth
    window.addEventListener('load', function() {
      // Retry TG init (async script should be loaded by now)
      if (!tg) {
        tg = initTelegramWebApp();
      }
      // Now check login bar (tg is set, even in Mini App)
      checkTgLoginBar();
      // Check auth status
      checkAuth();
    });

    // Also try immediately (for browsers without Telegram — checkTgLoginBar shows bar)
    // But only for NON-Mini-App contexts (don't show bar in Mini App)
    if (!window.Telegram) {
      // No Telegram at all — definitely a browser → show login bar
      checkTgLoginBar();
      checkAuth();
    }

    // Periodic auth check — picks up "logout all devices" within ~2 minutes
    // for already-open tabs without requiring a manual page reload.
    // Only runs in browser context (Mini App initData is always authenticated).
    setInterval(function() {
      if (tg && tg.initData) return; // skip Mini App
      checkAuth();
    }, 120000);

    // --- Register service worker for offline PWA support ---
    // Caches the app shell (index.html, icons, manifest, bridge.js) so the
    // main page works offline. Player and API calls always need network.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
          console.log('[sw] registered, scope:', reg.scope);
        }).catch(function(e) {
          console.warn('[sw] registration failed:', e);
        });
      });
    }

    // --- PWA install info (mobile-only) ---
    // Shows a floating "📲 Как установить приложение" button ONLY when:
    //   - NOT in Telegram Mini App
    //   - NOT already running as installed PWA (display-mode: standalone)
    //   - On a mobile device (phone or tablet)
    // Desktop browsers have their own native install prompts (Chrome ⊕ in
    // address bar) so we don't show this button there.
    //
    // Click opens a modal with platform-specific instructions:
    //   - iOS Safari: Share → На экран Домой
    //   - Chrome/Edge Android: uses beforeinstallprompt (native install dialog)
    //     if available, otherwise instructions for menu ⋮
    //   - Firefox / other Android browsers: menu ⋮ → Добавить на главный экран

    function pwaIsStandalone() {
      try {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator.standalone === true) ||
               (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
      } catch (_) { return false; }
    }

    function pwaIsTelegramMiniApp() {
      try {
        var t = window.Telegram && window.Telegram.WebApp;
        if (!t) return false;
        if (t.initData && t.initData.length > 0) return true;
        if (t.platform && t.platform !== 'unknown') return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaIsIOS() {
      try {
        var ua = navigator.userAgent || '';
        var platform = navigator.platform || '';
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        // iPadOS 13+ reports as MacIntel with touch
        if (platform === 'MacIntel' && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaIsMobile() {
      try {
        var ua = navigator.userAgent || '';
        // Android phone, iPhone, iPad, small Windows/Mac touch devices
        if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua)) return true;
        // iPadOS 13+
        if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaShowInstallInfoButton() {
      // Skip: Mini App, already-installed PWA, desktop browsers
      if (pwaIsTelegramMiniApp()) return;
      if (pwaIsStandalone()) return;
      if (!pwaIsMobile()) return;

      // Floating button at bottom-right corner (less intrusive than centered bar)
      var btn = document.createElement('button');
      btn.id = 'pwaInstallInfoBtn';
      btn.textContent = '📲';
      btn.title = 'Как установить приложение';
      btn.setAttribute('aria-label', 'Как установить приложение');
      btn.style.cssText = 'position:fixed;bottom:16px;right:16px;background:#007AFF;color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;z-index:1000;box-shadow:0 4px 16px rgba(0,122,255,0.5);font-family:inherit;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;line-height:1;';
      document.body.appendChild(btn);

      var deferredPrompt = null;
      var isIOS = pwaIsIOS();

      // Chrome/Edge fire beforeinstallprompt — capture for native flow
      window.addEventListener('beforeinstallprompt', function(e) {
        console.log('[pwa] beforeinstallprompt fired');
        e.preventDefault();
        deferredPrompt = e;
      });

      // If app gets installed (any browser), hide button
      window.addEventListener('appinstalled', function() {
        console.log('[pwa] app installed');
        btn.remove();
      });

      btn.addEventListener('click', function() {
        if (deferredPrompt) {
          // Native Chrome/Edge flow — show install prompt directly
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() {
            deferredPrompt = null;
          }).catch(function() {});
        } else if (isIOS) {
          pwaShowIosInstructions();

          pwaShowAndroidInstructions();

    // --- Resume card: load last watched film ---

    const resumeClose = document.getElementById('resumeClose');

    async function loadResumeCard() {
      // Note: removed sessionStorage dismissal check — card should always show
      // if user has a recently watched film.
      try {
        const res = await fetch('/api/last-film', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: getUserId() // fallback for browser users
          })
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.film) return;
        // Only show if watched in last 48h
        const age = Date.now() - new Date(data.film.ts).getTime();
        if (age > 48 * 60 * 60 * 1000) return;
        resumeFilm = data.film;

        // Resolve the best position to display + use for resume:
        //   1. Server-provided position (cross-device, saved by player.html on another device)
        //   2. localStorage position (this device's last session)
        // Server wins because it's the most recent across all devices.
        let bestPosition = 0;
        if (typeof data.film.position === 'number' && data.film.position > 5) {
          bestPosition = data.film.position;
        } else {
          try {
            const raw = localStorage.getItem(`genopoisk_position_${data.film.filmId}`);
            if (raw) {
              const pos = JSON.parse(raw);
              if (pos && pos.t && pos.t > 5) bestPosition = pos.t;
            }
          } catch (_) {}
        }

        // Save server position to localStorage so player.html picks it up
        // even if it doesn't read ?t= URL param.
        if (bestPosition > 5) {
          try {
            localStorage.setItem(`genopoisk_position_${data.film.filmId}`, JSON.stringify({
              t: bestPosition,
              d: data.film.duration || 0,
              ts: new Date().toISOString(),
              title: data.film.title
            }));
          } catch (_) {}
          resumeTitle.textContent = data.film.title;
          resumeMeta.textContent = '▶ с ' + formatResumeTime(bestPosition);
        } else {
          resumeTitle.textContent = data.film.title;
          resumeMeta.textContent = 'Продолжить просмотр';
        }
        resumeCard.classList.add('visible');
      } catch (e) { console.warn('resume load error:', e); }
    }

    function formatResumeTime(s) {
      if (!s || s < 0 || !isFinite(s)) s = 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      const pad = (n) => n < 10 ? '0' + n : '' + n;
      return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
    }

    resumeCard.addEventListener('click', async (e) => {
      if (e.target === resumeClose) return;
      if (resumeFilm) {
        const tgUsername = localStorage.getItem('genopoisk_tg_username') || '';
        const payload = JSON.stringify({
          type: 'movies_opened',
          initData: getTgInitData(),
          userId: getUserId(),
          username: tgUsername,
          filmId: resumeFilm.filmId,
          title: resumeFilm.title
        });
        try {
          await fetch('/api/track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
        } catch (err) {
          console.warn('track error:', err);
          try {
            if (navigator.sendBeacon) {
              const blob = new Blob([payload], { type: 'application/json' });
              navigator.sendBeacon('/api/track', blob);
            }
          } catch (_) {}
        }
        // Pass ?t= so player.html knows the cross-device resume position
        const startPos = (typeof resumeFilm.position === 'number' && resumeFilm.position > 5)
          ? resumeFilm.position
          : 0;
        const tParam = startPos > 0 ? `&t=${startPos}` : '';
        setTimeout(function() {
          window.location.href = `player.html?id=${resumeFilm.filmId}&title=${encodeURIComponent(resumeFilm.title)}${tParam}`;
        }, 100);
      }
    });
    resumeClose.addEventListener('click', (e) => {
      e.stopPropagation();
      resumeCard.classList.remove('visible');
    });

    // Fire async — don't block page load
    loadResumeCard();

    // Retry after window load — telegram-web-app.js loads async, so tgInitData
    // may not be available on first call. Without initData, browser userId is
    // used as fallback, but in Telegram Mini App we want the real Telegram ID.
    window.addEventListener('load', function() {
      // Re-init Telegram WebApp (script may have loaded by now)
      if (!tg) tg = initTelegramWebApp();
      // Only retry if card is not visible yet
      if (!resumeCard.classList.contains('visible')) {
        loadResumeCard();
      }
    });

    let currentCategory = null;
    let currentPage = 1;
    let isLoading = false;
    let hasMore = true;

    const content = document.getElementById('content');
    const loader = document.getElementById('loader');
    const filmGrid = document.getElementById('filmGrid');
    const searchInput = document.getElementById('searchInput');

    function toggleTheme() {
      const body = document.body;
      const isLight = body.classList.contains('light-theme');
      body.classList.toggle('light-theme');
      localStorage.setItem('theme', isLight ? 'dark' : 'light');
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.content = isLight ? '#000000' : '#F2F2F7';
    }

    // Load saved theme
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.content = '#F2F2F7';
    }

    async function apiGet(url) {
      try {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json' }
        });
        if (!res.ok) {
          // Try to parse JSON error response — our backend returns helpful
          // messages for known errors (e.g. 403 = VPN blocked).
          let errData = null;
          try { errData = await res.json(); } catch (_) {}
          if (errData && errData.message) {
            throw new Error(errData.message);
          }
          throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        }
        return await res.json();
      } catch (e) {
        console.error('API Error:', e);
        throw e;
      }
    }

    function extractFilms(data) {
      if (!data) return [];
      return data.films || data.items || data.results || [];
    }

    async function getPopular(page = 1) {
      const url = `${API_BASE}/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=7&ratingTo=10&yearFrom=2020&yearTo=2025&page=${page}`;
      return extractFilms(await apiGet(url));
    }

    async function getTop250(page = 1) {
      const url = `${API_BASE}/v2.2/films/top?type=TOP_250_BEST_FILMS&page=${page}`;
      const d = await apiGet(url);
      const f = extractFilms(d);
      if (f.length === 0) {
        const fb = `${API_BASE}/v2.2/films?order=RATING&type=FILM&ratingFrom=8&ratingTo=10&page=${page}`;
        return extractFilms(await apiGet(fb));
      }
      return f;
    }

    async function getNew(page = 1) {
      const currentYear = new Date().getFullYear();
      const url = `${API_BASE}/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=0&ratingTo=10&yearFrom=${currentYear}&yearTo=${currentYear}&page=${page}`;
      return extractFilms(await apiGet(url));
    }

    async function getRandomFilm() {
      const randomPage = Math.floor(Math.random() * 5) + 1;
      const films = await getTop250(randomPage);
      if (films && films.length > 0) return films[Math.floor(Math.random() * films.length)];
      return null;
    }

    // In-flight search request — if user types another character while the
    // previous search is still loading, we abort it and start a new one.
    // This prevents stale results from overwriting newer ones, and avoids
    // wasting bandwidth on requests the user no longer cares about.
    let currentSearchController = null;

    async function searchFilms(query) {
      // Abort previous in-flight search
      if (currentSearchController) {
        try { currentSearchController.abort(); } catch (_) {}
      }
      currentSearchController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const url = `${API_BASE}/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}&page=1`;
      try {
        const data = await apiGet(url);
        return extractFilms(data);
      } finally {
        currentSearchController = null;
      }
    }

    function showLoader() {
      content.classList.remove('hidden');
      loader.classList.remove('hidden');
    }

    function hideLoader() {
      loader.classList.add('hidden');
    }

    function clearFilms() {
      filmGrid.innerHTML = '';
      filmGrid.classList.remove('centered');
    }

    function showEmptyState(msg) {
      hideLoader();
      filmGrid.classList.remove('centered');
      filmGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🎬</div><div class="empty-text">${msg}</div></div>`;
    }

    function displayFilms(films, forceCenter = false) {
      clearFilms();
      appendFilms(films, forceCenter);
    }

    // Append films to grid without clearing (for infinite scroll)
    function appendFilms(films, forceCenter = false) {
      if (!films || films.length === 0) {
        if (filmGrid.children.length === 0) showEmptyState('Фильмы не найдены');
        return;
      }
      filmGrid.classList.remove('centered');
      const frag = document.createDocumentFragment();
      films.forEach((film, index) => {
        const filmId = film.filmId || film.kinopoiskId;
        const title = film.nameRu || film.nameEn || 'Без названия';
        const year = film.year || 'Н/Д';
        const rating = film.rating || film.ratingKinopoisk || 'Н/Д';
        const poster = film.posterUrlPreview || film.posterUrl || '';
        const card = document.createElement('div');
        card.className = 'film-card';
        // Stagger animation delay only for first 10 cards (avoid huge delays
        // on infinite scroll loads)
        if (index < 10) card.style.animationDelay = `${index * 0.04}s`;
        // Use loading="lazy" for off-screen posters — browser loads them
        // only when scrolled into view, speeding up initial render.
        // decoding="async" prevents poster decoding from blocking main thread.
        card.innerHTML = `
          <img src="${poster}" class="film-poster" alt="${title}" loading="lazy" decoding="async" onerror="this.style.opacity='0.3';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%232C2C2E%22 width=%22200%22 height=%22300%22/><text x=%22100%22 y=%22160%22 text-anchor=%22middle%22 fill=%22%2398989D%22 font-size=%2214%22>Нет постера</text></svg>'">
          <div class="film-info">
            <div class="film-title">${title}</div>
            <div class="film-meta">
              <span>${year}</span>
              ${rating !== 'Н/Д' ? `<span class="rating">⭐ ${rating}</span>` : ''}
            </div>
          </div>`;
        card.onclick = () => openPlayer(filmId, title);
        frag.appendChild(card);
      });
      filmGrid.appendChild(frag);
      hideLoader();
      if (forceCenter || films.length === 1) {
        filmGrid.classList.add('centered');
      }
    }

    async function openPlayer(filmId, title) {
      // Send track event reliably before navigating.
      const tgUsername = localStorage.getItem('genopoisk_tg_username') || '';
      const payload = JSON.stringify({
        type: 'movies_opened',
        initData: getTgInitData(),
        userId: getUserId(),
        username: tgUsername,
        filmId: filmId,
        title: title
      });
      try {
        await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        });
      } catch (e) {
        console.warn('track error:', e);
        // Fallback: sendBeacon (may not parse as JSON on server, but better than nothing)
        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: 'application/json' });
            navigator.sendBeacon('/api/track', blob);
          }
        } catch (_) {}
      }
      // Small delay to ensure request is sent before navigation
      setTimeout(function() {
        window.location.href = `player.html?id=${filmId}&title=${encodeURIComponent(title)}`;
      }, 100);
    }

    async function loadCategory(category) {
      currentCategory = category;
      currentPage = 1;
      hasMore = true;
      clearFilms();
      showLoader();
      searchInput.value = '';
      trackEvent('categories_opened', { category });
      try {
        if (category === 'random') {
          const film = await getRandomFilm();
          if (film) displayFilms([film], true);
          else showEmptyState('Не удалось загрузить случайный фильм');
        } else {
          await loadMoreFilms();
        }
      } catch (e) {
        showEmptyState('Ошибка загрузки: ' + e.message);
      }
    }

    // Load user's favorites from backend and display as a grid.
    // Each favorite has filmId + title; we fetch poster from kinopoisk by id.
    async function loadFavorites() {
      currentCategory = null;
      hasMore = false;
      clearFilms();
      showLoader();
      searchInput.value = '';
      const uid = getUserId();
      if (!uid || uid.startsWith('web_')) {
        showEmptyState('Войдите через Telegram, чтобы видеть избранное');
        return;
      }
      try {
        const res = await fetch('/api/my-films', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: uid, initData: getTgInitData() })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const favs = data.favorites || [];
        if (favs.length === 0) {
          showEmptyState('В избранном пока пусто. Нажмите ☆ в плеере, чтобы добавить фильм.');
          return;
        }
        // Fetch each film's details from kinopoisk (poster, year, rating).
        // Do it in parallel for speed; cap at 30 to avoid hammering API.
        const films = await Promise.all(favs.slice(0, 30).map(async function(f) {
          try {
            const r = await fetch('/api/kinopoisk?q=v2.2/films/' + encodeURIComponent(f.filmId));
            if (!r.ok) return null;
            const j = await r.json();
            return extractFilms({ films: [j] })[0] || null;
          } catch (_) { return null; }
        }));
        // Filter out failed fetches
        const valid = films.filter(Boolean);
        if (valid.length === 0) {
          showEmptyState('Не удалось загрузить постеры фильмов из избранного');
          return;
        }
        displayFilms(valid);
      } catch (e) {
        showEmptyState('Ошибка загрузки избранного: ' + e.message);
      }
    }

    async function loadMoreFilms() {
      if (isLoading || !hasMore || !currentCategory) return;
      isLoading = true;
      try {
        let films = [];
        switch (currentCategory) {
          case 'popular':
            films = await getPopular(currentPage);
            break;
          case 'top250':
            films = await getTop250(currentPage);
            break;
          case 'new':
            films = await getNew(currentPage);
            break;
        }
        if (films.length > 0) {
          appendFilms(films);
          currentPage++;
        } else {
          hasMore = false;
          if (filmGrid.children.length === 0) showEmptyState('Фильмы не найдены');
          else hideLoader();
        }
      } catch (e) {
        showEmptyState('Ошибка загрузки: ' + e.message);
        hasMore = false;
      } finally {
        isLoading = false;
      }
    }

    // --- Search behavior ---
    // When user types, search results REPLACE the category buttons (actions)
    // instead of appearing in a separate dropdown. When search is cleared,
    // categories reappear.
    // 250ms debounce — fast enough to feel live, slow enough to avoid
    // hammering the API on every keystroke.
    const actionsEl = document.querySelector('.actions');

    function hideCategories() {
      if (actionsEl) actionsEl.style.display = 'none';
    }
    function showCategories() {
      if (actionsEl) actionsEl.style.display = '';
    }

    let searchTimeout;
    // Clear button: clears the field AND dismisses the keyboard on mobile
    // (blur() is what actually triggers keyboard dismissal on iOS Safari
    // and Android Chrome). Also restores the previous category view.
    const searchClearBtn = document.getElementById('searchClear');
    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.blur(); // dismiss keyboard
        showCategories();
        if (currentCategory) {
          loadCategory(currentCategory);
        } else {
          content.classList.add('hidden');
          clearFilms();
        }
      });
    }
    // Enter key on mobile keyboard = "Готово"/Done → dismiss keyboard
    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchInput.blur();
      }
    });
    searchInput.addEventListener('input', function(e) {
      clearTimeout(searchTimeout);
      const val = e.target.value.trim();
      if (!val || val.length < 2) {
        // Too short — show categories again, hide grid
        showCategories();
        if (!currentCategory) {
          content.classList.add('hidden');
          clearFilms();
        }
        return;
      }
      // Search results replace the category buttons
      hideCategories();
      // 250ms debounce — fast live search feel
      searchTimeout = setTimeout(async () => {
        currentCategory = null;
        currentPage = 1;
        hasMore = false;
        clearFilms();
        showLoader();
        trackEvent('searches', { query: val });
        try {
          const films = await searchFilms(val);
          displayFilms(films);
        } catch (e) {
          showEmptyState('Ошибка поиска: ' + e.message);
        }
      }, 250);
    });

    let scrollTimeout;
    window.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        const scrollPosition = window.innerHeight + window.scrollY;
        const threshold = document.documentElement.scrollHeight - 800;
        if (scrollPosition >= threshold &&
            currentCategory &&
            currentCategory !== 'random' &&
            !isLoading &&
            hasMore) {
          loadMoreFilms();
        }
      }, 100);
    });

    if (window.Telegram?.WebApp) {
      const themeParams = window.Telegram.WebApp.themeParams;
      if (themeParams?.bg_color) {
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.content = themeParams.bg_color;
      }
      // Apply Telegram theme to body
      if (themeParams?.text_color) document.documentElement.style.setProperty('--text-primary', themeParams.text_color);
      if (themeParams?.bg_color) document.documentElement.style.setProperty('--bg-primary', themeParams.bg_color);
    }

    // Main button for Mini App back navigation
    if (tg && tg.BackButton) {
      tg.BackButton.hide();
    }
  </script>
</body>
</html>
