  <title>Genopoisk</title>
  <script>
    // ====== Performance & error logging ======
    window.addEventListener('DOMContentLoaded', function() {
      console.log('[perf] DOMContentLoaded at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('load', function() {
      console.log('[perf] Window load at', (performance.now() / 1000).toFixed(2) + 's');
    });
    window.addEventListener('error', function(e) {
      console.error('[error]', e.message, e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[unhandled rejection]', e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script async src="https://telegram.org/js/telegram-web-app.js" onerror="console.log('[tg] telegram-web-app.js unavailable (running outside Telegram Mini App — this is normal)')"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{--ios-blue:#007AFF;--ios-purple:#5856D6;--ios-pink:#FF2D55;}
    body{--bg-primary:#000;--bg-secondary:#1C1C1E;--bg-tertiary:#2C2C2E;--text-primary:#FFF;--text-secondary:#98989D;--separator:rgba(84,84,88,0.6);--fill:rgba(120,120,128,0.2);--fill-secondary:rgba(120,120,128,0.16);--fill-tertiary:rgba(118,118,128,0.12);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
    body.light-theme{--bg-primary:#F2F2F7;--bg-secondary:#FFF;--bg-tertiary:#F2F2F7;--text-primary:#000;--text-secondary:#6E6E73;--separator:rgba(60,60,67,0.29);}
    body.night-theme{--bg-primary:#050510;--bg-secondary:#0A0A1A;--bg-tertiary:#14142A;--text-primary:#E8E8F0;--text-secondary:#7878A0;--separator:rgba(120,120,160,0.2);--fill:rgba(80,80,120,0.15);--fill-secondary:rgba(80,80,120,0.1);--fill-tertiary:rgba(80,80,120,0.08);}
    body.night-theme{background:#050510;}
    body.night-theme .hero{background:linear-gradient(135deg,rgba(20,20,60,0.4) 0%,rgba(40,20,80,0.3) 50%,rgba(60,20,60,0.3) 100%);}
    body.night-theme .film-card{background:#0A0A1A;}
    body.night-theme .search-input{background:#0A0A1A;}
    body.night-theme .action-card{background:rgba(80,80,120,0.12);}
    body.night-theme .content{background:#0A0A1A;}
    body.night-theme .tg-login-bar{background:rgba(80,80,120,0.15);}
    /* Reduce blue light in night mode — warmer colors, less eye strain */
    body.night-theme *{filter:saturate(0.85) hue-rotate(-8deg);}
    body.night-theme img,body.night-theme video,body.night-template iframe{filter:none;}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px;}
    .hero{text-align:center;padding:40px 20px;margin-bottom:32px;position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,rgba(0,122,255,0.15) 0%,rgba(88,86,214,0.15) 50%,rgba(255,45,85,0.15) 100%);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--separator);box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);}
    .hero-title{font-size:clamp(32px,6vw,48px);font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#007AFF 0%,#5856D6 50%,#FF2D55 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.03em;line-height:1.1;cursor:pointer;user-select:none;transition:transform 0.2s;}
    .hero-title:active{transform:scale(0.98);}
    .hero-subtitle{font-size:clamp(14px,2vw,17px);color:var(--text-secondary);font-weight:500;letter-spacing:-0.01em;}
    .search-wrapper{margin-bottom:24px;}
    .search-container{position:relative;max-width:600px;margin:0 auto;}
    .search-input{width:100%;padding:14px 20px 14px 44px;font-size:17px;font-weight:500;background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:16px;color:var(--text-primary);outline:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);font-family:inherit;}
    .search-input::placeholder{color:var(--text-secondary);}
    .search-input:focus{background:var(--bg-tertiary);border-color:var(--ios-blue);box-shadow:0 0 0 4px rgba(0,122,255,0.2);transform:translateY(-2px);}
    .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none;opacity:0.6;}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.18);border:none;color:var(--text-primary);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1;-webkit-tap-highlight-color:transparent;}
    .search-clear.visible{display:flex;}
    .search-clear:active{background:rgba(255,255,255,0.32);transform:translateY(-50%) scale(0.92);}
    /* Make room for the clear button when visible */
    .search-input{padding-right:44px;}
    .search-input:not(:placeholder-shown) ~ .search-clear{display:flex;}
    .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px;}
    /* Padding for fixed bottom Telegram button */
    body { padding-bottom: 60px; }
    #fixedTelegramBtn.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }

    /* === PRODUCTION EFFECTS (always on) === */

    /* Cube loader — replaces spinner */
    .loader .spinner { display: none; }
    .loader { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .loader .fx-cube-loader {
      width: 44px; height: 44px;
      transform: rotateZ(45deg);
      position: relative;
      margin-right: 14px;
    }
    .loader .fx-cube-loader span {
      display: block; position: absolute;
      width: 20px; height: 20px;
      background: var(--ios-blue);
      animation: prod-cube-fold 2.4s infinite linear;
    }
    .loader .fx-cube-loader span:nth-child(1) { top: 0; left: 0; }
    .loader .fx-cube-loader span:nth-child(2) { top: 0; right: 0; animation-delay: 0.6s; background: var(--ios-purple); }
    .loader .fx-cube-loader span:nth-child(3) { bottom: 0; left: 0; animation-delay: 1.2s; background: var(--ios-pink); }
    .loader .fx-cube-loader span:nth-child(4) { bottom: 0; right: 0; animation-delay: 1.8s; background: #f59e0b; }
    @keyframes prod-cube-fold {
      0%, 10%   { transform: perspective(120px) rotateX(-180deg); opacity: 0; }
      25%, 75%  { transform: perspective(120px) rotateX(0deg);   opacity: 1; }
      90%, 100% { transform: perspective(120px) rotateY(180deg);  opacity: 0; }
    }

    /* Holographic action cards — repel from cursor + touch */
    .action-card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --tx: 0px;
      --ty: 0px;
      background: var(--fill);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--separator);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      /* Smooth spring return when NOT tracking (touch release / mouseleave).
         Cubic-bezier with overshoot gives a satisfying settle-to-neutral. */
      transition: border-color 0.3s, box-shadow 0.3s;
      /* Prevent text selection on long press */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Desktop-only: holo transform effect (tilt + translate) */
    @media (hover: hover) and (pointer: fine) {
      .action-card {
        transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                    border-color 0.3s, box-shadow 0.3s;
        transform: perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateX(var(--tx)) translateY(var(--ty));
      }
      .action-card.tracking {
        transition: transform 0.08s linear, border-color 0.2s, box-shadow 0.2s;
      }
    }
    .action-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at var(--mx) var(--my),
        rgba(0,122,255,0.3),
        rgba(88,86,214,0.2),
        rgba(255,45,85,0.1),
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    /* Glow + border on hover (desktop only — JS detects mobile and
       doesn't attach handlers there, so these rules are inert on mobile).
       Subtle reaction — only border-color change + soft shadow. */
    /* Action card hover/active effects — DESKTOP ONLY.
       On touch devices (mobile, Telegram Mini App), :hover and :active
       can stick after tap, causing visual glitches. Restrict to devices
       with real hover support (mouse) and fine pointer. */
    @media (hover: hover) and (pointer: fine) {
      .action-card:hover::before,
      .action-card.tracking::before { opacity: 1; }
      .action-card:hover,
      .action-card.tracking {
        border-color: var(--ios-blue);
        box-shadow: 0 8px 28px rgba(0,122,255,0.22);
      }
      .action-card:active { transform: perspective(800px) scale(0.94); }
    }
    /* On touch devices — no hover/active effects at all */
    @media not all and (hover: hover) and (pointer: fine) {
      .action-card:hover,
      .action-card:active,
      .action-card:hover::before { transform: none; opacity: 0; box-shadow: none; }
    }
    .action-icon{font-size:40px;margin-bottom:8px;display:block;filter:drop-shadow(0 4px 12px rgba(0,122,255,0.3));position:relative;z-index:1;}
    .action-title{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em;position:relative;z-index:1;}

    /* Film card entrance animation */
    .film-card {
      animation: prod-card-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .film-card:nth-child(1) { animation-delay: 0.03s; }
    .film-card:nth-child(2) { animation-delay: 0.06s; }
    .film-card:nth-child(3) { animation-delay: 0.09s; }
    .film-card:nth-child(4) { animation-delay: 0.12s; }
    .film-card:nth-child(5) { animation-delay: 0.15s; }
    .film-card:nth-child(6) { animation-delay: 0.18s; }
    .film-card:nth-child(7) { animation-delay: 0.21s; }
    .film-card:nth-child(8) { animation-delay: 0.24s; }
    .film-card:nth-child(n+9) { animation-delay: 0.27s; }
    @keyframes prod-card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Hero title holographic glow — base animated layer */
    .hero-title {
      position: relative;
      isolation: isolate;
      --cursor-x: 50%;
      --cursor-y: 50%;
      --cursor-strength: 0;
    }
    .hero-title::after {
      content: '';
      position: absolute;
      inset: -10px -20px;
      background: radial-gradient(
        ellipse at center,
        rgba(0,122,255,0.15),
        rgba(88,86,214,0.1),
        rgba(255,45,85,0.08),
        transparent 70%
      );
      filter: blur(20px);
      z-index: -1;
      animation: hero-holo 6s ease-in-out infinite alternate;
    }
    /* Cursor-following glow layer (PC only — JS adds .cursor-glow class
       on mousemove over the hero). This sits ON TOP of the base animation
       and intensifies the glow at the cursor's position. */
    .hero-title.cursor-glow::before {
      content: '';
      position: absolute;
      inset: -30px -50px;
      background: radial-gradient(
        circle at var(--cursor-x) var(--cursor-y),
        rgba(0,122,255,calc(0.5 * var(--cursor-strength))),
        rgba(88,86,214,calc(0.35 * var(--cursor-strength))),
        rgba(255,45,85,calc(0.2 * var(--cursor-strength))),
        transparent 60%
      );
      filter: blur(24px);
      z-index: -1;
      pointer-events: none;
      transition: --cursor-strength 0.3s ease;
    }
    @keyframes hero-holo {
      0% { background: radial-gradient(ellipse at 30% 50%, rgba(0,122,255,0.2), rgba(88,86,214,0.1), transparent 70%); }
      50% { background: radial-gradient(ellipse at 70% 50%, rgba(255,45,85,0.15), rgba(88,86,214,0.12), transparent 70%); }
      100% { background: radial-gradient(ellipse at 50% 30%, rgba(88,86,214,0.18), rgba(0,122,255,0.1), transparent 70%); }
    }
    .content{background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:24px;padding:24px;min-height:400px;margin-bottom:32px;position:relative;overflow:hidden;}
    .content.hidden{display:none;}
    .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-primary);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);z-index:10;}
    .loader.hidden{display:none;}
    .spinner{width:44px;height:44px;border:3px solid var(--fill);border-top-color:var(--ios-blue);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loader-text{font-size:15px;font-weight:500;color:var(--text-secondary);letter-spacing:-0.01em;}
    .film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
    /* Desktop (>= 1024px) — larger cards for bigger screens */
    @media (min-width: 1024px) {
      .film-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }
    @media (min-width: 1440px) {
      .film-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
      }
    }
    .film-grid.centered {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      min-height:300px;
    }
    /* Single film (random or search with 1 result) — centered, same size
       as regular cards. Responsive to screen size. */
    .film-grid.random-mode {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 0;
      min-height: 300px;
      padding: 20px 0;
    }
    .film-grid.random-mode .film-card {
      width: 140px;
      max-width: 140px;
    }
    @media (min-width: 1024px) {
      .film-grid.random-mode .film-card {
        width: 180px;
        max-width: 180px;
      }
    }
    @media (min-width: 1440px) {
      .film-grid.random-mode .film-card {
        width: 200px;
        max-width: 200px;
      }
    }
    .film-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.4s cubic-bezier(0.2,0.8,0.2,1),box-shadow 0.4s;background:var(--bg-secondary);box-shadow:0 14px 30px -10px rgba(0,0,0,0.4);}
    .film-card:hover{transform:translateY(-8px);box-shadow:0 20px 50px -10px rgba(0,122,255,0.5);z-index:2;}
    .film-poster {width: 100%;height:auto;aspect-ratio:2/3;object-fit:cover;background: linear-gradient(135deg,var(--bg-secondary) 0%,var(--bg-tertiary) 100%);display: block;margin: 0 auto;transition:transform 0.7s cubic-bezier(0.2,0.8,0.2,1);}
    .film-card:hover .film-poster{transform:scale(1.12);}
    .film-info{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.9));transform:translateY(100%);transition:transform 0.4s ease;z-index:2;}
    .film-card:hover .film-info{transform:translateY(0);}
    .film-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.3;letter-spacing:-0.01em;}
    .film-meta{font-size:12px;color:rgba(255,255,255,0.85);font-weight:500;display:flex;align-items:center;gap:6px;}
    .rating{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;background:rgba(0,122,255,0.3);border-radius:6px;font-weight:600;color:#5ac8fa;}
    .empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}
    .empty-icon{font-size:64px;margin-bottom:16px;opacity:0.4;filter:grayscale(1);}
    .empty-text{font-size:17px;font-weight:500;letter-spacing:-0.01em;}
    .resume-card{display:none;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(0,122,255,0.18) 0%,rgba(88,86,214,0.18) 100%);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:20px;padding:14px 16px;margin-bottom:24px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;}
    .resume-card:hover{transform:translateY(-2px);border-color:var(--ios-blue);box-shadow:0 12px 36px rgba(0,122,255,0.3);}
    .resume-card:active{transform:scale(0.99);}
    .resume-icon{font-size:32px;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,122,255,0.4));}
    .resume-info{flex:1;min-width:0;}
    .resume-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
    .resume-title{font-size:16px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em;}
    .resume-meta{font-size:12px;color:var(--text-secondary);margin-top:2px;}
    .resume-close{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(120,120,128,0.3);color:var(--text-primary);border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:all 0.2s;}
    .resume-close:hover{background:rgba(255,45,85,0.4);}
    .resume-close:active{transform:scale(0.9);}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    .resume-card.visible{display:flex;animation:slideDown 0.3s ease;}
    .footer{text-align:center;padding:32px 20px;margin-top:40px;border-top:1px solid var(--separator);}
    .footer-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:8px;letter-spacing:-0.01em;}
    .footer-text{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;}
    .footer-link{display:inline-block;padding:8px 16px;background:var(--fill);border:1px solid var(--separator);border-radius:12px;color:var(--ios-blue);text-decoration:none;font-size:14px;font-weight:600;transition:all 0.3s;}
    .footer-link:hover{background:var(--ios-blue);color:white;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,122,255,0.4);}
    .tg-login-bar{display:none;justify-content:center;align-items:center;background:var(--fill);border:1px solid var(--separator);border-radius:16px;padding:14px 16px;margin-bottom:16px;}
    .tg-login-bar.visible{display:flex;}
    #tgWidgetContainer{display:flex;justify-content:center;overflow:hidden;}
    #tgWidgetContainer iframe{max-width:100%;border:none;overflow:hidden;}
    @media (max-width:768px){.container{padding:16px 12px;}.hero{padding:32px 16px;margin-bottom:24px;}.actions{grid-template-columns:repeat(2,1fr);}.film-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
    @media (max-width:480px){.hero-title{font-size:28px;}.action-icon{font-size:32px;}.film-grid{gap:10px;}}

    /* ====== Long-press film info popup (mobile) ====== */
    /* On touch devices :hover doesn't fire, so film-info is invisible.
       Long-press (touchstart + hold 500ms) opens this modal with the
       film details. Inside the modal, text IS selectable so users can
       copy the title/year (the rest of the page blocks copy). */
    .film-info-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1500;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .film-info-overlay.visible { opacity: 1; pointer-events: auto; }
    .film-info-popup {
      background: var(--bg-secondary);
      border: 1px solid var(--separator);
      border-radius: 20px;
      padding: 20px;
      max-width: 340px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      /* Explicitly ENABLE text selection inside the popup, overriding
         the body-wide user-select: none */
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    .film-info-overlay.visible .film-info-popup { transform: scale(1); }
    .film-info-popup .fip-poster {
      width: 80px; height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--bg-tertiary);
      display: block; margin: 0 auto 14px;

    .film-info-popup .fip-title {
      font-size: 18px; font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
      letter-spacing: -0.01em;
      /* allow selection highlight to show */
    }
    .film-info-popup .fip-meta {
      display: flex; justify-content: center; align-items: center;
      gap: 10px; flex-wrap: wrap;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .film-info-popup .fip-rating {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 8px;
      background: rgba(0,122,255,0.25);
      border-radius: 8px;
      font-weight: 700;
      color: #5ac8fa;
    }
    .film-info-popup .fip-actions {
      display: flex; gap: 10px;
    }
    .film-info-popup .fip-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .film-info-popup .fip-btn:active { transform: scale(0.96); }
    .film-info-popup .fip-btn-primary {
      background: var(--ios-blue); color: #fff;
    }
    .film-info-popup .fip-btn-secondary {
      background: var(--fill); color: var(--text-primary);
      border: 1px solid var(--separator);
    }
    /* Long-press hint shown briefly when grid loads on touch devices */
    .longpress-hint {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff; font-size: 13px;
      padding: 8px 16px; border-radius: 20px;
      z-index: 1200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    .longpress-hint.visible { opacity: 1; }

    /* ====== Lite version banner (shown on TV / projector / large screens) ====== */
    .lite-banner {
      display: none;
      background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
    }
    .lite-banner.visible { display: flex; }
    .lite-banner .lite-text {
      display: flex; align-items: center; gap: 10px; flex: 1;
    }
    .lite-banner .lite-icon { font-size: 22px; }
    .lite-banner .lite-link {
      background: #fff;
      color: #007AFF;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }
    .lite-banner .lite-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ====== On-screen D-pad for projectors / TVs (no keyboard) ====== */
    /* Many Android projectors' remotes emulate a MOUSE, not a keyboard.
       Their arrow keys move the on-screen cursor — there's no `keydown`
       event we can intercept. For those devices, we show a fixed on-screen
       D-pad that the cursor (or finger on touch) can click directly. */
    .on-screen-dpad {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 180px;
      height: 180px;
      z-index: 998;
      display: none;
      pointer-events: auto;
    }
    .on-screen-dpad.visible { display: block; }
    .on-screen-dpad .dpad-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.92);
      color: #fff;
      border: 2px solid rgba(0, 122, 255, 0.6);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, background 0.15s;
    }
    .on-screen-dpad .dpad-btn:hover, .on-screen-dpad .dpad-btn:focus-visible {
      background: rgba(0, 122, 255, 0.3);
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .on-screen-dpad .dpad-btn:active { transform: scale(0.92); }
    .on-screen-dpad .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
    .on-screen-dpad .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .on-screen-dpad .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); }
    .on-screen-dpad .dpad-right { right: 0; top: 50%; transform: translateY(-50%); }
    .on-screen-dpad .dpad-ok {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: rgba(0, 122, 255, 0.85);
      font-weight: 700;
      font-size: 14px;
    }
    .on-screen-dpad .dpad-toggle {
      position: absolute;
      top: -38px;
      right: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.92);
      color: #888;
      border: 1px solid #333;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Fixed "Open in Telegram" button — always visible at bottom on scroll -->

  <div class="on-screen-dpad" id="onScreenDpad">

    <button class="dpad-btn dpad-right" data-dir="right" title="Вправо">▶</button>
    <button class="dpad-btn dpad-ok"    data-dir="ok"    title="OK / Выбрать">OK</button>
  </div>

  <script>
    // ====== Global error handler — surface JS errors to user ======
    // If any JS error occurs (especially on old Chrome versions on
    // projectors), show it in a small banner so the user knows what's
    // wrong instead of seeing a dead page.
    window.addEventListener('error', function(e) {
      console.error('[global-error]', e.message, e.filename + ':' + e.lineno);
      // Show error to user (but only if it's not a network resource error)
      if (e.message && e.message.indexOf('Script error') === -1) {
        try {
          var errBanner = document.createElement('div');
          errBanner.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;background:#8B0000;color:#fff;padding:10px;border-radius:8px;font-size:12px;z-index:9999;font-family:monospace;max-height:120px;overflow:auto';
          errBanner.textContent = 'JS Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
          document.body.appendChild(errBanner);
        } catch (_) {}
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
      console.error('[unhandled-rejection]', reason);
    });

    // ====== Copy/inspect protection ======
    // EXCEPT inside the long-press film info popup — there users CAN select
    // and copy the title/year/rating (that's the whole point of the popup).
    function isInsideFilmInfoPopup(el) {
      return !!(el && el.closest && el.closest('.film-info-popup'));
    }
    document.addEventListener('contextmenu', e => {
      if (isInsideFilmInfoPopup(e.target)) return; // allow context menu in popup
      e.preventDefault();
    });
    document.addEventListener('copy', e => {
      if (isInsideFilmInfoPopup(e.target)) return; // allow copy in popup
      e.preventDefault();
    });
    document.addEventListener('cut', e => {
      if (isInsideFilmInfoPopup(e.target)) return;
      e.preventDefault();
    });
    document.addEventListener('selectstart', e => {
      if (isInsideFilmInfoPopup(e.target)) return; // allow text selection in popup
      e.preventDefault();
    });
    document.onkeydown = function(e) {
      // Allow copy/cut shortcuts inside the long-press film info popup
      if (isInsideFilmInfoPopup(e.target)) return;
      const key = e.key || '';
      if (e.ctrlKey && (key === 'c' || key === 'C' || key === 'x' || key === 'X' || key === 'u' || key === 'U' || key === 's' || key === 'S')) {
        e.preventDefault();
        return false;
      }
      if (key === 'F12') {
        e.preventDefault();
        return false;
      }
    };

    const API_BASE = '/api/kinopoisk'; // server-side proxy hides the API key

    // --- Telegram WebApp init (MUST run BEFORE getBrowserUserId) ---
    // We need to extract TG user ID from initData and store it in localStorage
    // BEFORE getBrowserUserId() reads it, so profiles are linked.
    let tgInitData = '';
    let tg = null;
    function initTelegramWebApp() {
      tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return null;
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
      } catch (_) {}
      tgInitData = tg.initData || '';
      if (tgInitData) {
        try {
          const params = new URLSearchParams(tgInitData);
          const userJson = params.get('user');
          if (userJson) {
            const u = JSON.parse(userJson);
            localStorage.setItem('genopoisk_tg_user_id', String(u.id));
            if (u.username) localStorage.setItem('genopoisk_tg_username', u.username);
            console.log('[tg] Linked TG user ID:', u.id, 'username:', u.username);
          }
        } catch (_) {}
      }
      console.log('[tg] Telegram WebApp initialized, has initData:', !!tgInitData);
      return tg;
    }
    // Try immediately — in Telegram Mini App, telegram-web-app.js is already loaded
    tg = initTelegramWebApp();

    // --- User identification ---
    // Priority: 1) Stored TG user ID (from previous Telegram visit, in localStorage)
    //           2) Stable localStorage web_ ID (persists across VPN changes)
    function getBrowserUserId() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) {
        console.log('[user] Using stored TG ID:', tgId);
        return tgId;
      }
      let id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        const rand = Math.random().toString(36).slice(2, 11);
        const time = Date.now().toString(36);
        id = `web_${time}_${rand}`;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }
    // DYNAMIC userId — re-reads localStorage EVERY TIME (not a const!)
    // This fixes the core bug: telegram-web-app.js loads async and stores
    // TG user ID in localStorage AFTER getBrowserUserId() was first called.
    // With a const, all subsequent trackEvent calls used the old web_ ID.
    function getUserId() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) return tgId;
      let id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        const rand = Math.random().toString(36).slice(2, 11);
        const time = Date.now().toString(36);
        id = `web_${time}_${rand}`;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }

    // --- Telegram OIDC Login bar ---
    // Two states:
    //   A) Not logged in → show "Войти через Telegram" (login button)
    //   B) Logged in → show "Открыть в Telegram" (link to bot) + ✕ close button
    // User can dismiss state B with ✕ — it remembers the dismissal in
    // sessionStorage so it stays hidden during the browsing session.
    // In Mini App (running inside Telegram already) the bar is hidden entirely.
    const tgLoginBar = document.getElementById('tgLoginBar');
    const tgLoginStateLoggedOut = document.getElementById('tgLoginStateLoggedOut');
    const tgLoginStateLoggedIn = document.getElementById('tgLoginStateLoggedIn');
    const tgLoginBarCloseBtn = document.getElementById('tgLoginBarClose');

    function checkTgLoginBar() {
      const isInTelegram = !!(tg && tg.initData);
      const storedTgId = localStorage.getItem('genopoisk_tg_user_id');
      const storedTgUsername = localStorage.getItem('genopoisk_tg_username');
      const isLoggedIn = !!(storedTgId || storedTgUsername);

      // Hide/show fixed bottom Telegram button
      var fixedBtn = document.getElementById('fixedTelegramBtn');
      var fixedText = document.getElementById('fixedTelegramText');
      // Detect TV/projector/large non-touch screen — hide the fixed Telegram
      // button there (it clutters the bottom of the screen and gets in the
      // way of D-pad navigation). User can still open Telegram via the top
      // login bar or the lite-banner link.
      var isTVDevice = (function() {
        var ua = (navigator.userAgent || '').toLowerCase();
        var tvPatterns = ['tv', 'television', 'googletv', 'android tv', 'smarttv', 'smart tv',
                          'projector', 'bravia', 'webos', 'tizen', 'hbbtv', 'roku', 'firetv',
                          'aftt', 'aftm', 'bento'];
        for (var i = 0; i < tvPatterns.length; i++) {
          if (ua.indexOf(tvPatterns[i]) !== -1) return true;
        }
        // Android tablet-like with large screen + no real touch = projector
        var isAndroid = ua.indexOf('android') !== -1;
        var hasRealTouch = (navigator.maxTouchPoints || 0) > 0;
        if (isAndroid && window.innerWidth >= 1024 && !hasRealTouch) return true;
        // Removed: "no touch + large screen" check — caused false positives
        // on desktop monitors (1920px+ is common for Full HD/2K/4K monitors).
        // Real TVs/projectors are caught by UA keywords above.
        return false;
      })();
      if (fixedBtn) {
        if (isInTelegram || isTVDevice) {
          fixedBtn.classList.add('hidden');
        } else {
          fixedBtn.classList.remove('hidden');
          if (fixedText && typeof t === 'function') fixedText.textContent = t('openInTelegram');
        }
      }

      // Top bar: only show login button if NOT logged in.
      // If logged in — hide top bar entirely (fixed bottom button handles it).
      if (isInTelegram) {
        tgLoginBar.classList.remove('visible');
        return;
      }
      if (isLoggedIn) {
        // Logged in — hide top bar, fixed bottom button is enough
        tgLoginBar.classList.remove('visible');
        return;
      }
      // Not logged in — show login button in top bar
      tgLoginStateLoggedOut.style.display = '';
      tgLoginStateLoggedIn.style.display = 'none';
      tgLoginBar.classList.add('visible');
    }

    if (tgLoginBarCloseBtn) {
      tgLoginBarCloseBtn.addEventListener('click', function() {
        sessionStorage.setItem('genopoisk_tg_bar_dismissed', '1');
        tgLoginBar.classList.remove('visible');
      });
    }
    // DON'T call checkTgLoginBar yet — wait for telegram-web-app.js to load
    // (it's async, so tg might be null on first run even in Mini App)

    // Check for ?telegram_login=success&tg_id=... (from OAuth callback redirect)
    const urlParams = new URLSearchParams(window.location.search);
    const telegramLogin = urlParams.get('telegram_login');
    const tgIdFromUrl = urlParams.get('tg_id');
    const tgNameFromUrl = urlParams.get('tg_name');
    const tgUsernameFromUrl = urlParams.get('tg_username');

    if (telegramLogin === 'success' && tgIdFromUrl) {
      // OAuth success — store user data
      localStorage.setItem('genopoisk_tg_user_id', String(tgIdFromUrl));
      if (tgNameFromUrl) localStorage.setItem('genopoisk_tg_user_name', tgNameFromUrl);
      if (tgUsernameFromUrl) localStorage.setItem('genopoisk_tg_username', tgUsernameFromUrl);
      console.log('[tg] OIDC login successful, TG ID:', tgIdFromUrl, 'username:', tgUsernameFromUrl);
      // Clean URL
      history.replaceState(null, '', window.location.pathname);
      window.location.reload();
    } else if (telegramLogin === 'error') {
      const msg = urlParams.get('message') || 'unknown';
      console.error('[tg] OIDC login error:', msg);
      history.replaceState(null, '', window.location.pathname);
    }

    if (tgIdFromUrl && !telegramLogin) {
      localStorage.setItem('genopoisk_tg_user_id', String(tgIdFromUrl));
      if (tgNameFromUrl) localStorage.setItem('genopoisk_tg_user_name', tgNameFromUrl);
      console.log('[tg] Linked via bot, TG ID:', tgIdFromUrl);
      history.replaceState(null, '', window.location.pathname);
      window.location.reload();

    // --- Check if user still exists in stats (after "logout all devices") ---
    async function checkAuth() {
      const tgId = localStorage.getItem('genopoisk_tg_user_id');
      const tgUsername = localStorage.getItem('genopoisk_tg_username');
      if (!tgId && !tgUsername) return; // not logged in at all
      if (tg && tg.initData) return; // Mini App — always authenticated
      try {
        const res = await fetch('/api/user-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: tgId, username: tgUsername, initData: getTgInitData() })
        });
        const data = await res.json();
        if (data.reauth) {
          console.log('[auth] User not found, clearing localStorage');
          localStorage.removeItem('genopoisk_tg_user_id');
          localStorage.removeItem('genopoisk_tg_user_name');
          localStorage.removeItem('genopoisk_tg_username');
          window.location.reload();
        }
      } catch (e) { console.warn('[auth] check failed:', e); }
    }

    // This ensures tg is available before checkTgLoginBar and checkAuth
    window.addEventListener('load', function() {
      // Retry TG init (async script should be loaded by now)
      if (!tg) {
        tg = initTelegramWebApp();
      }
      // Now check login bar (tg is set, even in Mini App)
      checkTgLoginBar();
      // Check auth status
      checkAuth();
    });

    // Also try immediately (for browsers without Telegram — checkTgLoginBar shows bar)
    // But only for NON-Mini-App contexts (don't show bar in Mini App)
    if (!window.Telegram) {
      // No Telegram at all — definitely a browser → show login bar
      checkTgLoginBar();
      checkAuth();

    // for already-open tabs without requiring a manual page reload.
    // Only runs in browser context (Mini App initData is always authenticated).
    setInterval(function() {
      if (tg && tg.initData) return; // skip Mini App
      checkAuth();

    // --- PWA install info (mobile-only) ---
    // Shows a floating "📲 Как установить приложение" button ONLY when:
    //   - NOT in Telegram Mini App
    //   - NOT already running as installed PWA (display-mode: standalone)
    //   - On a mobile device (phone or tablet)
    // Desktop browsers have their own native install prompts (Chrome ⊕ in
    // address bar) so we don't show this button there.
    //
    // Click opens a modal with platform-specific instructions:
    //   - iOS Safari: Share → На экран Домой
    //   - Chrome/Edge Android: uses beforeinstallprompt (native install dialog)
    //     if available, otherwise instructions for menu ⋮
    //   - Firefox / other Android browsers: menu ⋮ → Добавить на главный экран

    function pwaIsStandalone() {
      try {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator.standalone === true) ||
               (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
      } catch (_) { return false; }
    }

    function pwaIsTelegramMiniApp() {
      try {
        var t = window.Telegram && window.Telegram.WebApp;
        if (!t) return false;
        if (t.initData && t.initData.length > 0) return true;
        if (t.platform && t.platform !== 'unknown') return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaIsIOS() {
      try {
        var ua = navigator.userAgent || '';
        var platform = navigator.platform || '';
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        // iPadOS 13+ reports as MacIntel with touch
        if (platform === 'MacIntel' && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaIsMobile() {
      try {
        var ua = navigator.userAgent || '';
        // Android phone, iPhone, iPad, small Windows/Mac touch devices
        if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua)) return true;
        // iPadOS 13+
        if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints && navigator.maxTouchPoints > 1) return true;
        return false;
      } catch (_) { return false; }
    }

    function pwaShowInstallInfoButton() {
      // Skip: Mini App, already-installed PWA, desktop browsers
      if (pwaIsTelegramMiniApp()) return;
      if (pwaIsStandalone()) return;
      if (!pwaIsMobile()) return;

      // Floating button at bottom-right corner (less intrusive than centered bar)
      var btn = document.createElement('button');
      btn.id = 'pwaInstallInfoBtn';
      btn.textContent = '📲';
      btn.title = 'Как установить приложение';

    // --- Holo card repel + glow tracking (production) ---
    // Cards repel from cursor (tilt away) + glow follows cursor
    document.addEventListener('mousemove', function(e) {
      document.querySelectorAll('.action-card').forEach(function(card) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        // Track cursor within 150px of card (for repel + glow)
        if (x >= -150 && x <= rect.width + 150 && y >= -150 && y <= rect.height + 150) {
          // Glow position (0-100%)
          var px = Math.max(0, Math.min(100, (x / rect.width) * 100));
          var py = Math.max(0, Math.min(100, (y / rect.height) * 100));
          card.style.setProperty('--mx', px + '%');
          card.style.setProperty('--my', py + '%');

          // Repel: card tilts AWAY from cursor
          // Center of card = (width/2, height/2)
          // Cursor offset from center: -1 to 1
          var cx = (x / rect.width) - 0.5;   // -0.5 (left) to 0.5 (right)
          var cy = (y / rect.height) - 0.5;   // -0.5 (top) to 0.5 (bottom)
          // Tilt: cursor on left → card tilts right (repel)
          var maxTilt = 15; // max degrees
          var maxShift = 8; // max pixels shift
          var rx = -cy * maxTilt * 2;  // negate Y for natural tilt
          var ry = cx * maxTilt * 2;
          var tx = cx * maxShift * 2;
          var ty = cy * maxShift * 2;
          // Smooth clamp
          rx = Math.max(-maxTilt, Math.min(maxTilt, rx));
          ry = Math.max(-maxTilt, Math.min(maxTilt, ry));
          tx = Math.max(-maxShift, Math.min(maxShift, tx));
          ty = Math.max(-maxShift, Math.min(maxShift, ty));
          card.style.setProperty('--rx', rx + 'deg');
          card.style.setProperty('--ry', ry + 'deg');
          card.style.setProperty('--tx', tx + 'px');
          card.style.setProperty('--ty', ty + 'px');
        }
      });
    });

    // Track initial page view

    // --- Resume card: load last watched film ---
    const resumeCard = document.getElementById('resumeCard');
    const resumeTitle = document.getElementById('resumeTitle');
    const resumeMeta = document.getElementById('resumeMeta');
    const resumeClose = document.getElementById('resumeClose');
    let resumeFilm = null;

    async function loadResumeCard() {
      // Note: removed sessionStorage dismissal check — card should always show
      // if user has a recently watched film.
      try {
        var uid = getUserId();
        var initData = getTgInitData();
        console.log('[resume] loadResumeCard called, uid:', uid, 'initData:', initData ? 'yes' : 'no');
        const res = await fetch('/api/last-film', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: initData,
            userId: uid || ''
          })
        });
        if (!res.ok) { console.warn('[resume] last-film HTTP', res.status); return; }
        const data = await res.json();
        console.log('[resume] last-film response:', data.film ? data.film.title : 'null');
        if (!data.film) return;
        // Only show if watched in last 48h
        const age = Date.now() - new Date(data.film.ts).getTime();
        if (age > 48 * 60 * 60 * 1000) return;
        resumeFilm = data.film;

        // Resolve the best position to display + use for resume:
        //   1. Server-provided position (cross-device, saved by player.html on another device)
        //   2. localStorage position (this device's last session)
        // Server wins because it's the most recent across all devices.
        let bestPosition = 0;
        if (typeof data.film.position === 'number' && data.film.position > 5) {
          bestPosition = data.film.position;
        } else {
          try {
            const raw = localStorage.getItem(`genopoisk_position_${data.film.filmId}`);
            if (raw) {
              const pos = JSON.parse(raw);
              if (pos && pos.t && pos.t > 5) bestPosition = pos.t;
            }
          } catch (_) {}
        }

        // Save server position to localStorage so player.html picks it up
        // even if it doesn't read ?t= URL param.
        if (bestPosition > 5) {
          try {
            localStorage.setItem(`genopoisk_position_${data.film.filmId}`, JSON.stringify({
              t: bestPosition,
              d: data.film.duration || 0,
              ts: new Date().toISOString(),
              title: data.film.title
            }));
          } catch (_) {}
          resumeTitle.textContent = data.film.title;
          resumeMeta.textContent = '▶ с ' + formatResumeTime(bestPosition);
        } else {
          resumeTitle.textContent = data.film.title;
          resumeMeta.textContent = 'Продолжить просмотр';
        }
        // Set poster image from our proxy
        var posterEl = document.getElementById('resumePoster');
        if (posterEl) {
          posterEl.src = '/api/poster?id=' + encodeURIComponent(data.film.filmId) + '&size=small';
          posterEl.style.display = 'block';
          posterEl.onerror = function() { this.style.display = 'none'; };
        }
        resumeCard.classList.add('visible');
      } catch (e) { console.warn('resume load error:', e); }
    }

    function formatResumeTime(s) {
      if (!s || s < 0 || !isFinite(s)) s = 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      const pad = (n) => n < 10 ? '0' + n : '' + n;
      return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
    }

    resumeCard.addEventListener('click', async (e) => {
      if (e.target === resumeClose) return;
      if (resumeFilm) {
        const tgUsername = localStorage.getItem('genopoisk_tg_username') || '';
        const payload = JSON.stringify({
          type: 'movies_opened',
          initData: getTgInitData(),
          userId: getUserId(),
          username: tgUsername,
          filmId: resumeFilm.filmId,
          title: resumeFilm.title
        });
        try {
          await fetch('/api/track', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
        } catch (err) {
          console.warn('track error:', err);
          try {
            if (navigator.sendBeacon) {
              const blob = new Blob([payload], { type: 'application/json' });
              navigator.sendBeacon('/api/track', blob);
            }
          } catch (_) {}
        }
        // Pass ?t= so player.html knows the cross-device resume position
        const startPos = (typeof resumeFilm.position === 'number' && resumeFilm.position > 5)
          ? resumeFilm.position
          : 0;
        const tParam = startPos > 0 ? `&t=${startPos}` : '';
        setTimeout(function() {
          window.location.href = `player.html?id=${resumeFilm.filmId}&title=${encodeURIComponent(resumeFilm.title)}${tParam}`;
        }, 100);
      }
    });
    resumeClose.addEventListener('click', (e) => {
      e.stopPropagation();
      resumeCard.classList.remove('visible');
    });

    // Fire async — don't block page load
    loadResumeCard();

    // Prefetch BOTH lambdas on page load to warm them up:
    // 1. /api/poster — first call takes 2+ seconds (cold start),
    //    subsequent calls are 40ms (Vercel Edge cache).
    // 2. /api/kinopoisk — first call also slow (cold start + upstream fetch),
    //    subsequent calls are 250ms (cache hit).
    // By firing prefetches on page load, we warm BOTH caches BEFORE the
    // user clicks a category. When they click "Популярные", both lambdas
    // are already warm — films + posters load in <500ms total.
    try {

    // ====== Theme system ======
    // Four modes: 'dark' (default), 'light', 'night' (extra dark, low blue),
    // 'auto' (chooses based on time of day + system preference).
    // Click on the 'Genopoisk' title cycles: dark → light → night → auto.
    //
    // Auto mode logic:
    //   - 07:00–19:00 → light (daytime)
    //   - 19:00–22:00 → dark (evening)
    //   - 22:00–07:00 → night (night, low blue light for eye comfort)
    //   - If system prefers-color-scheme is dark, shift one step darker
    //     (day→dark, evening→night, night stays night)
    //
    // Auto mode re-evaluates every 30 minutes (covers sun changing position
    // while the page is open).

    function applyTheme(theme) {
      var body = document.body;
      body.classList.remove('light-theme', 'night-theme');
      if (theme === 'light') {
        body.classList.add('light-theme');
      } else if (theme === 'night') {
        body.classList.add('night-theme');
      }
      // 'dark' = no extra class (default body styles)
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.content = theme === 'light' ? '#F2F2F7' : (theme === 'night' ? '#050510' : '#000000');
      }
    }

    function getAutoTheme() {
      var hour = new Date().getHours();
      var prefersDark = false;
      try {
        prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (_) {}
      var theme;
      if (hour >= 7 && hour < 19) {
        theme = prefersDark ? 'dark' : 'light';
      } else if (hour >= 19 && hour < 22) {
        theme = prefersDark ? 'night' : 'dark';
      } else {
        theme = 'night';
      }
      return theme;
    }

    function getCurrentThemeMode() {
      return localStorage.getItem('theme_mode') || 'dark';
    }

    function resolveTheme() {
      var mode = getCurrentThemeMode();
      if (mode === 'auto') {
        return getAutoTheme();
      }
      return mode; // 'dark', 'light', or 'night'
    }

    function applyCurrentTheme() {
      applyTheme(resolveTheme());
    }

    function toggleTheme() {
      // Cycle: dark → light → night → auto → dark
      var modes = ['dark', 'light', 'night', 'auto'];
      var current = getCurrentThemeMode();
      var idx = modes.indexOf(current);
      if (idx === -1) idx = 0;
      var next = modes[(idx + 1) % modes.length];
      localStorage.setItem('theme_mode', next);
      applyCurrentTheme();

      var labels = window.__themeLabels || { dark: '🌙 Тёмная', light: '☀️ Светлая', night: '🌌 Ночная', auto: '🔄 Авто (по времени)' };
      if (typeof showToast === 'function') {
        showToast(labels[next] || next, 1500);
      } else {
        console.log('[theme] Switched to:', next);
      }
    }

    // ====== Action card holographic tracking (DESKTOP ONLY) ======
    // Cards ONLY move when:
    //   - Desktop: cursor hovers DIRECTLY over the card (no press needed)
    //     Mousemove within card bounds updates tilt + glow.
    //     Mouseleave → spring back to neutral.
    //   - Mobile (Telegram Mini App, phones, tablets, any touch device):
    //     cards are COMPLETELY STATIC. Touch does nothing — no tilt,
    //     no glow, no tracking. This matches the user's request:
    //     "remove finger-tracking on mobile".
    //
    // Detection: isMobileView() (same helper used for pagination).
    function setupActionCardEffects() {
      // MOBILE = no effects at all on action cards
      if (isMobileView()) {
        return;
      }

      var cards = document.querySelectorAll('.action-card');
      cards.forEach(function(card) {
        var raf = null;

        function updateFromPoint(clientX, clientY) {
          var rect = card.getBoundingClientRect();
          var x = clientX - rect.left;
          var y = clientY - rect.top;
          var px = Math.max(0, Math.min(100, (x / rect.width) * 100));
          var py = Math.max(0, Math.min(100, (y / rect.height) * 100));
          // Reduced tilt: ±6° instead of ±10° — subtler reaction
          var rx = ((y / rect.height) - 0.5) * -12;
          var ry = ((x / rect.width) - 0.5) * 12;
          card.style.setProperty('--mx', px + '%');
          card.style.setProperty('--my', py + '%');
          card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
          card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
        }

        function startTracking() {
          card.classList.add('tracking');
        }
        function stopTracking() {
          card.classList.remove('tracking');
          card.style.setProperty('--mx', '50%');
          card.style.setProperty('--my', '50%');
          card.style.setProperty('--rx', '0deg');
          card.style.setProperty('--ry', '0deg');
        }

        // Desktop: hover-tracking (no button press needed).
        // mousemove over the card itself updates position 1:1.
        card.addEventListener('mouseenter', function(e) {
          startTracking();
          updateFromPoint(e.clientX, e.clientY);
        });
        card.addEventListener('mousemove', function(e) {
          if (raf) cancelAnimationFrame(raf);
          var x = e.clientX, y = e.clientY;
          raf = requestAnimationFrame(function() {
            updateFromPoint(x, y);
          });
        });
        card.addEventListener('mouseleave', stopTracking);
      });
    }

    // ====== Hero title cursor-following glow (DESKTOP ONLY) ======
    // On desktop, the Genopoisk hero title glows brighter where the
    // cursor is. The .cursor-glow class is added on mouseenter over
    // the hero (or any ancestor), and the --cursor-x/y/--cursor-strength
    // CSS vars update on mousemove. On mobile: no effect, just the
    // base animated glow.
    function setupHeroTitleGlow() {
      if (isMobileView()) return;
      var heroTitle = document.querySelector('.hero-title');
      var hero = document.querySelector('.hero');
      if (!heroTitle || !hero) return;
      var raf = null;

      hero.addEventListener('mouseenter', function() {
        heroTitle.classList.add('cursor-glow');
        heroTitle.style.setProperty('--cursor-strength', '1');
      });
      hero.addEventListener('mousemove', function(e) {
        if (raf) cancelAnimationFrame(raf);
        var x = e.clientX, y = e.clientY;
        raf = requestAnimationFrame(function() {
          var rect = heroTitle.getBoundingClientRect();
          // Position relative to hero-title's bounding box
          var px = ((x - rect.left) / rect.width) * 100;
          var py = ((y - rect.top) / rect.height) * 100;
          // Clamp to [-20, 120] so glow extends slightly beyond title
          px = Math.max(-20, Math.min(120, px));
          py = Math.max(-20, Math.min(120, py));
          heroTitle.style.setProperty('--cursor-x', px + '%');
          heroTitle.style.setProperty('--cursor-y', py + '%');
          // Strength = 1 when cursor is near the title, fades to 0.3
          // when cursor is at the edge of the hero section
          var cx = (rect.left + rect.width / 2);
          var cy = (rect.top + rect.height / 2);
          var dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
          var maxDist = 400; // pixels
          var strength = Math.max(0.3, 1 - dist / maxDist);
          heroTitle.style.setProperty('--cursor-strength', strength.toFixed(2));
        });
      });
      hero.addEventListener('mouseleave', function() {
        heroTitle.style.setProperty('--cursor-strength', '0');
        // Keep .cursor-glow class so the fade-out is visible
        setTimeout(function() {
          if (heroTitle.style.getPropertyValue('--cursor-strength') === '0') {
            heroTitle.classList.remove('cursor-glow');
          }
        }, 400);
      });
    }

    // Run after DOM is ready (cards must exist before attaching handlers)

    // apiGet with automatic retry on 429/403 (Cloudflare IP block from VPN).
    // Uses ES5 syntax (var, function) for compatibility with old Chrome
    // versions on Android projectors (some run Chrome 50-70 which doesn't
    // support let/const/arrow functions).
    async function apiGet(url) {
      var lastErr = null;
      for (var attempt = 0; attempt < 2; attempt++) {
        try {
          var res = await fetch(url, {
            headers: { 'Content-Type': 'application/json' }
          });
          if (res.ok) return await res.json();

          // Try to parse JSON error response
          var errData = null;
          try { errData = await res.json(); } catch (_) {}

          // Retry on 429, 403, 5xx — all could be transient (VPN block,
          // Cloudflare rate-limit, lambda cold start, etc.)
          var isRetryable = (res.status === 429 || res.status === 403 ||
                             res.status === 500 || res.status === 502 ||
                             res.status === 503 || res.status === 504);
          if (isRetryable && attempt === 0) {
            var msg = (errData && errData.message) || ('HTTP ' + res.status);
            lastErr = new Error(msg);
            console.warn('[apiGet] Got ' + res.status + ', retrying in 2s...', msg);
            // Show a friendly hint to the user
            var filmGridEl = document.getElementById('filmGrid');
            if (filmGridEl && filmGridEl.children.length === 0) {
              filmGridEl.innerHTML = '<div class="empty-state">⏳ Кинопоиск временно недоступен (VPN/блокировка). Пробую ещё раз...</div>';
            }
            await new Promise(function(resolve) { setTimeout(resolve, 2000); });
            continue;
          }

          // Other errors — throw immediately
          if (errData && errData.message) throw new Error(errData.message);
          throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        } catch (e) {
          // Network error — retry once
          lastErr = e;
          if (attempt === 0) {
            console.warn('[apiGet] Network error, retrying in 2s:', e.message);
            await new Promise(function(resolve) { setTimeout(resolve, 2000); });
            continue;
          }
          throw e;
        }
      }
      throw lastErr || new Error('Request failed');
    }

    function extractFilms(data) {
      if (!data) return [];

    async function getPopular(page = 1) {

        const fb = `${API_BASE}/v2.2/films?order=RATING&type=FILM&ratingFrom=8&ratingTo=10&page=${page}`;

    async function getRandomFilm() {

    // In-flight search request — if user types another character while the
    // previous search is still loading, we abort it and start a new one.
    // This prevents stale results from overwriting newer ones, and avoids
    // wasting bandwidth on requests the user no longer cares about.
    let currentSearchController = null;

    async function searchFilms(query) {
      // Abort previous in-flight search
      if (currentSearchController) {
        try { currentSearchController.abort(); } catch (_) {}
      }
      currentSearchController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const url = `${API_BASE}/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}&page=1`;
      try {
        const data = await apiGet(url);
        return extractFilms(data);
      } finally {
        currentSearchController = null;
      }
    }

    function showLoader() {

      loader.classList.remove('hidden');

    function hideLoader() {
      loader.classList.add('hidden');

    // Show loader until all posters in the grid have loaded.
    // Called after appendFilms — waits for every <img> to fire onload/onerror.
    // Uses a Map to track which images are still pending.
    var posterLoadTimeout = null;
    function waitForPosters() {
      // Clear any previous timeout
      if (posterLoadTimeout) clearTimeout(posterLoadTimeout);
      // Get only NEW posters (not yet loaded — no .loaded or .error class)
      var imgs = filmGrid.querySelectorAll('img.film-poster:not(.loaded):not(.error)');
      if (imgs.length === 0) {
        hideLoader();
        return;
      }
      var pending = imgs.length;
      function check() {
        pending--;
        if (pending <= 0) {
          hideLoader();
          if (posterLoadTimeout) { clearTimeout(posterLoadTimeout); posterLoadTimeout = null; }
        }
      }
      imgs.forEach(function(img) {
        if (img.complete) {
          // Already loaded or errored
          if (img.naturalWidth > 0) {
            img.classList.add('loaded');
          } else {
            img.classList.add('error');
          }
          check();
        } else {
          img.addEventListener('load', function() {
            this.classList.add('loaded');
            check();
          }, { once: true });
          img.addEventListener('error', function() {
            this.classList.add('error');
            check();
          }, { once: true });
        }
      });
      // Safety timeout — hide loader after 4s even if not all posters
      // loaded (was 10s — too long, made the site feel slow).
      // Posters will still load in the background and appear as they arrive.
      posterLoadTimeout = setTimeout(function() {
        // Force-load any remaining images
        filmGrid.querySelectorAll('img.film-poster:not(.loaded):not(.error)').forEach(function(img) {
          img.classList.add(img.naturalWidth > 0 ? 'loaded' : 'error');
        });
        hideLoader();
      }, 4000);
    }

    function clearFilms() {

    function showEmptyState(msg) {
      hideLoader();
