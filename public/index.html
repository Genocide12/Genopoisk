<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, minimum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genopoisk">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="shortcut icon" type="image/png" href="/icon-192.png">
  <link rel="preconnect" href="https://genopoisk.vercel.app">
  <link rel="dns-prefetch" href="https://genopoisk.vercel.app">
  <script src="/i18n.js"></script>
  <!-- Vercel Web Analytics (vanilla HTML CDN approach per Vercel docs) -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <title>Genopoisk</title>
  <script defer src="/js/error-handler.js?v=45"></script>
  <script async src="https://telegram.org/js/telegram-web-app.js" onerror="console.log('[tg] telegram-web-app.js unavailable (running outside Telegram Mini App — this is normal)')"></script>
  <link rel="stylesheet" href="/css/app.css?v=45">
  <script>try{fetch("/api/poster?id=251733&size=small").catch(function(){});fetch("/api/kinopoisk?q=v2.2/films/top&type=TOP_250_BEST_FILMS&page=1").catch(function(){});fetch("/api/kinopoisk?q=v2.2/films&order=NUM_VOTE&type=FILM&ratingFrom=7&ratingTo=10&yearFrom=2020&yearTo=2025&page=1").catch(function(){});}catch(e){}</script>
</head>
<body>
  <div class="container">
    <div class="tg-login-bar" id="tgLoginBar">
      <!-- State A: not logged in — show only login button -->
      <div class="tg-login-state" id="tgLoginStateLoggedOut">
        <a href="/api/auth/telegram/login" id="tgLoginBtn" style="background:#229ED9;color:#fff;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          Войти через Telegram
        </a>
      </div>
      <!-- State B: logged in — show "Open in Telegram" with close ✕ -->
      <div class="tg-login-state" id="tgLoginStateLoggedIn" style="display:none;align-items:center;gap:10px;">
        <a href="https://t.me/Genopoiskbot?start=app" target="_blank" rel="noopener" style="background:linear-gradient(135deg,#229ED9 0%,#2AABEE 100%);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,0.2);">
          <span style="font-size:16px;">🤖</span>
          Открыть в Telegram
        </a>
        <button id="tgLoginBarClose" title="Скрыть" style="background:rgba(255,255,255,0.15);border:none;color:var(--text-primary);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;-webkit-tap-highlight-color:transparent;">✕</button>
      </div>
    </div>
    <div class="hero">
      <h1 class="hero-title" onclick="toggleTheme()" title="Цикл: тёмная → светлая → ночная → авто"><span id="premiumBadge" style="display:none;margin-right:6px;font-size:0.7em;vertical-align:middle;filter:none !important;">🔥</span>Genopoisk</h1>
      <p class="hero-subtitle" id="heroSubtitle" style="display:none;"></p>
    </div>
    <div class="resume-card" id="resumeCard">
      <img class="resume-poster" id="resumePoster" src="" alt="" style="width:48px;height:68px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--bg-tertiary);display:none;">
      <div class="resume-info">
        <div class="resume-label">Продолжить просмотр</div>
        <div class="resume-title" id="resumeTitle">—</div>
        <div class="resume-meta" id="resumeMeta">—</div>
      </div>
      <button class="resume-close" id="resumeClose" title="Скрыть">✕</button>
    </div>
    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск фильмов..." autocomplete="off" enterkeyhint="done" inputmode="search" />
        <button class="search-clear" id="searchClear" type="button" title="Очистить">✕</button>
      </div>
    </div>
    <div class="actions">
      <div class="action-card" data-cat="popular" tabindex="0">
        <span class="action-icon">🔥</span>
        <div class="action-title">Популярные</div>
      </div>
      <div class="action-card" data-cat="top250" tabindex="0">
        <span class="action-icon">⭐</span>
        <div class="action-title">Топ 250</div>
      </div>
      <div class="action-card" data-cat="new" tabindex="0">
        <span class="action-icon">🎬</span>
        <div class="action-title">Новинки</div>
      </div>
      <div class="action-card" data-cat="random" tabindex="0">
        <span class="action-icon">🎯</span>
        <div class="action-title">Случайный</div>
      </div>
      <div class="action-card" data-cat="favorites" tabindex="0">
        <span class="action-icon">❤️</span>
        <div class="action-title">Коллекция</div>
      </div>
    </div>
    <div class="content hidden" id="content">
      <div class="loader" id="loader">
        <div class="fx-cube-loader">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="loader-text">Загрузка...</div>
      </div>
      <div class="film-grid" id="filmGrid"></div>
    </div>
    </div>
  </div>
  <!-- Fixed "Open in Telegram" button — always visible at bottom on scroll -->
  <a href="https://t.me/Genopoiskbot?start=app" target="_blank" rel="noopener" id="fixedTelegramBtn" style="position:fixed;bottom:0;left:0;right:0;z-index:999;background:linear-gradient(135deg,#229ED9 0%,#2AABEE 100%);color:#fff;text-align:center;padding:14px 20px;text-decoration:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 -4px 20px rgba(0,0,0,0.4);transition:transform 0.3s,opacity 0.3s;calc(env(safe-area-inset-bottom) + 14px) padding-bottom;">
    <span style="font-size:18px;">🤖</span>
    <span id="fixedTelegramText">Открыть в Telegram</span>
  </a>
  <!-- Long-press film info popup (mobile only — desktop uses :hover) -->
  <div class="film-info-overlay" id="filmInfoOverlay">
    <div class="film-info-popup" id="filmInfoPopup">
      <img class="fip-poster" id="fipPoster" src="" alt="">
      <div class="fip-title" id="fipTitle"></div>
      <div class="fip-meta" id="fipMeta"></div>
      <div class="fip-actions">
        <button class="fip-btn fip-btn-secondary" id="fipClose" data-i18n="filmInfoClose">Закрыть</button>
        <button class="fip-btn fip-btn-primary" id="fipOpen" data-i18n="filmInfoWatch">▶ Смотреть</button>
      </div>
    </div>
  </div>
  <script defer src="/js/app.js?v=45"></script>
</body>
</html>
