<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, minimum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genopoisk">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Genopoisk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{--ios-blue:#007AFF;--ios-purple:#5856D6;--ios-pink:#FF2D55;}
    body{--bg-primary:#000;--bg-secondary:#1C1C1E;--bg-tertiary:#2C2C2E;--text-primary:#FFF;--text-secondary:#98989D;--separator:rgba(84,84,88,0.6);--fill:rgba(120,120,128,0.2);--fill-secondary:rgba(120,120,128,0.16);--fill-tertiary:rgba(118,118,128,0.12);font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
    body.light-theme{--bg-primary:#F2F2F7;--bg-secondary:#FFF;--bg-tertiary:#F2F2F7;--text-primary:#000;--text-secondary:#6E6E73;--separator:rgba(60,60,67,0.29);}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px;}
    .hero{text-align:center;padding:40px 20px;margin-bottom:32px;position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,rgba(0,122,255,0.15) 0%,rgba(88,86,214,0.15) 50%,rgba(255,45,85,0.15) 100%);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--separator);box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);}
    .hero-title{font-size:clamp(32px,6vw,48px);font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,#007AFF 0%,#5856D6 50%,#FF2D55 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.03em;line-height:1.1;cursor:pointer;user-select:none;transition:transform 0.2s;}
    .hero-title:active{transform:scale(0.98);}
    .hero-subtitle{font-size:clamp(14px,2vw,17px);color:var(--text-secondary);font-weight:500;letter-spacing:-0.01em;}
    .search-wrapper{margin-bottom:24px;}
    .search-container{position:relative;max-width:600px;margin:0 auto;}
    .search-input{width:100%;padding:14px 52px 14px 44px;font-size:17px;font-weight:500;background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:16px;color:var(--text-primary);outline:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);font-family:inherit;}
    .search-input::placeholder{color:var(--text-secondary);}
    .search-input:focus{background:var(--bg-tertiary);border-color:var(--ios-blue);box-shadow:0 0 0 4px rgba(0,122,255,0.2);transform:translateY(-2px);}
    .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none;opacity:0.6;}

    /* ─── Голосовая кнопка ─── */
    .voice-btn{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      width:32px;height:32px;border-radius:50%;border:none;
      background:var(--fill);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
      font-size:16px;color:var(--text-secondary);
      -webkit-tap-highlight-color:transparent;
    }
    .voice-btn:hover{background:rgba(0,122,255,0.25);color:var(--ios-blue);}
    .voice-btn:active{transform:translateY(-50%) scale(0.9);}
    .voice-btn.listening{
      background:rgba(255,45,85,0.2);color:var(--ios-pink);
      animation:pulse-ring 1s ease-out infinite;
    }
    @keyframes pulse-ring{
      0%{box-shadow:0 0 0 0 rgba(255,45,85,0.5);}
      70%{box-shadow:0 0 0 10px rgba(255,45,85,0);}
      100%{box-shadow:0 0 0 0 rgba(255,45,85,0);}
    }
    /* Всплывающая подсказка голосового ввода */
    .voice-tooltip{
      position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
      background:rgba(28,28,30,0.95);color:#fff;border-radius:16px;
      padding:12px 20px;font-size:15px;font-weight:500;
      border:1px solid var(--separator);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      opacity:0;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
      pointer-events:none;z-index:100;white-space:nowrap;
      display:flex;align-items:center;gap:10px;
    }
    .voice-tooltip.visible{opacity:1;transform:translateX(-50%) translateY(0);}
    .voice-tooltip .mic-dot{
      width:10px;height:10px;border-radius:50%;background:var(--ios-pink);
      animation:blink 0.8s ease-in-out infinite;
      flex-shrink:0;
    }
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
    /* Ошибка голоса */
    .voice-error{
      text-align:center;font-size:13px;color:var(--ios-pink);
      margin-top:6px;min-height:18px;transition:opacity 0.3s;
    }

    .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:32px;}
    .action-card{position:relative;background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:20px;padding:24px 16px;text-align:center;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);overflow:hidden;}
    .action-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--ios-blue);box-shadow:0 12px 40px rgba(0,122,255,0.3);}
    .action-card:active{transform:scale(0.96);}
    .action-icon{font-size:40px;margin-bottom:8px;display:block;filter:drop-shadow(0 4px 12px rgba(0,122,255,0.3));}
    .action-title{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em;}
    .content{background:var(--fill);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--separator);border-radius:24px;padding:24px;min-height:400px;margin-bottom:32px;position:relative;overflow:hidden;}
    .content.hidden{display:none;}
    .loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-primary);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);z-index:10;}
    .loader.hidden{display:none;}
    .spinner{width:44px;height:44px;border:3px solid var(--fill);border-top-color:var(--ios-blue);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loader-text{font-size:15px;font-weight:500;color:var(--text-secondary);letter-spacing:-0.01em;}
    .film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;}
    .film-grid.centered{display:flex;justify-content:center;align-items:center;gap:0;min-height:300px;}
    .film-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);background:var(--bg-secondary);}
    .film-card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 20px 60px rgba(0,122,255,0.4);z-index:2;}
    .film-poster{width:140px;height:210px;object-fit:cover;background:linear-gradient(135deg,var(--bg-secondary) 0%,var(--bg-tertiary) 100%);display:block;margin:0 auto;}
    .film-info{padding:12px;background:linear-gradient(to top,var(--bg-secondary) 0%,transparent 100%);}
    .film-title{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.01em;}
    .film-meta{font-size:12px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px;}
    .rating{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;background:rgba(0,122,255,0.2);border-radius:6px;font-weight:600;color:var(--ios-blue);}
    .empty-state{text-align:center;padding:80px 20px;color:var(--text-secondary);}
    .empty-icon{font-size:64px;margin-bottom:16px;opacity:0.4;filter:grayscale(1);}
    .empty-text{font-size:17px;font-weight:500;letter-spacing:-0.01em;}
    @media (max-width:768px){.container{padding:16px 12px;}.hero{padding:32px 16px;margin-bottom:24px;}.actions{grid-template-columns:repeat(2,1fr);}.film-grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
    @media (max-width:480px){.hero-title{font-size:28px;}.action-icon{font-size:32px;}.film-grid{gap:10px;}}
  </style>

<body>
  <div class="container">
    <div class="hero">
      <h1 class="hero-title" onclick="toggleTheme()" title="Нажмите для смены темы">Genopoisk</h1>
      <p class="hero-subtitle">Кинотеатр в твоем кармане</p>
    </div>

    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" class="search-input" placeholder="Поиск фильмов..." autocomplete="off" />
        <button class="voice-btn" id="voiceBtn" title="Голосовой поиск" aria-label="Голосовой поиск">🎙️</button>
      </div>
      <div class="voice-error" id="voiceError"></div>
    </div>

    <div class="actions">
      <div class="action-card" onclick="loadCategory('popular')">
        <span class="action-icon">🔥</span>
        <div class="action-title">Популярные</div>
      </div>
      <div class="action-card" onclick="loadCategory('top250')">
        <span class="action-icon">⭐</span>
        <div class="action-title">Топ 250</div>
      </div>
      <div class="action-card" onclick="loadCategory('new')">
        <span class="action-icon">🎬</span>
        <div class="action-title">Новинки</div>
      </div>
      <div class="action-card" onclick="loadCategory('random')">
        <span class="action-icon">🎯</span>
        <div class="action-title">Случайный</div>
      </div>
    </div>

    <div class="content hidden" id="content">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Загрузка...</div>
      </div>
      <div class="film-grid" id="filmGrid"></div>
    </div>
  </div>

  <!-- Всплывающий статус голосового ввода -->
  <div class="voice-tooltip" id="voiceTooltip">
    <span class="mic-dot"></span>
    <span id="voiceTooltipText">Говорите...</span>
  </div>

  <script>
    // Защита от копирования / инспектора
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.onkeydown = function(e) {
      const key = e.key || '';
      if (e.ctrlKey && (key === 'c' || key === 'C' || key === 'x' || key === 'X' || key === 'u' || key === 'U' || key === 's' || key === 'S')) { e.preventDefault(); return false; }
      if (key === 'F12') { e.preventDefault(); return false; }
    };

    // ─── API ───────────────────────────────────────────────────────────────
    const API_KEY  = '3c4f040d3bf84b318fd52b2883b31077';
    const API_BASE = 'https://api.kinopoiskapi.uz';

    let currentCategory = null;
    let currentPage     = 1;
    let isLoading       = false;
    let hasMore         = true;

    const content    = document.getElementById('content');
    const loader     = document.getElementById('loader');
    const filmGrid   = document.getElementById('filmGrid');
    const searchInput = document.getElementById('searchInput');

    // Тема
    function toggleTheme() {
      const isLight = document.body.classList.contains('light-theme');
      document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', isLight ? 'dark' : 'light');
      const mt = document.querySelector('meta[name="theme-color"]');
      if (mt) mt.content = isLight ? '#000000' : '#F2F2F7';
    }
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-theme');
      const mt = document.querySelector('meta[name="theme-color"]');
      if (mt) mt.content = '#F2F2F7';
    }

    // ─── API-запрос ────────────────────────────────────────────────────────
    async function apiGet(url) {
      const res = await fetch(url, {
        headers: { 'X-API-KEY': API_KEY, 'Content-Type': 'application/json' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    function extractFilms(data) {
      if (!data) return [];
      return data.films || data.items || data.results || [];
    }

    // ─── Запросы к kinopoiskapi.uz ─────────────────────────────────────────
    // Структура эндпоинтов совместима с kinopoiskapiunofficial.tech v2.2
    async function getPopular(page = 1) {
      const data = await apiGet(`${API_BASE}/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=7&ratingTo=10&yearFrom=2020&yearTo=2025&page=${page}`);
      return extractFilms(data);
    }

    async function getTop250(page = 1) {
      try {
        const data = await apiGet(`${API_BASE}/v2.2/films/top?type=TOP_250_BEST_FILMS&page=${page}`);
        const f = extractFilms(data);
        if (f.length) return f;
      } catch(e) { /* fallback */ }
      const fb = await apiGet(`${API_BASE}/v2.2/films?order=RATING&type=FILM&ratingFrom=8&ratingTo=10&page=${page}`);
      return extractFilms(fb);
    }

    async function getNew(page = 1) {
      const yr = new Date().getFullYear();
      const data = await apiGet(`${API_BASE}/v2.2/films?order=YEAR&type=FILM&ratingFrom=6&ratingTo=10&yearFrom=${yr - 1}&yearTo=${yr}&page=${page}`);
      return extractFilms(data).filter(f => f.posterUrlPreview || f.posterUrl);
    }

    async function getRandomFilm() {
      const p = Math.floor(Math.random() * 5) + 1;
      const films = await getTop250(p);
      return films && films.length ? films[Math.floor(Math.random() * films.length)] : null;
    }

    async function searchFilms(query) {
      // Пробуем v2.1 (keyword search), затем v2.2 (filter by keyword)
      try {
        const data = await apiGet(`${API_BASE}/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}&page=1`);
        return extractFilms(data);
      } catch(e) {
        // Запасной вариант: поиск по v2.2
        const data = await apiGet(`${API_BASE}/v2.2/films?keyword=${encodeURIComponent(query)}&page=1`);
        return extractFilms(data);
      }
    }

    // ─── UI helpers ───────────────────────────────────────────────────────
    function showLoader()    { content.classList.remove('hidden'); loader.classList.remove('hidden'); }
    function hideLoader()    { loader.classList.add('hidden'); }
    function clearFilms()    { filmGrid.innerHTML = ''; filmGrid.classList.remove('centered'); }
    function showEmptyState(msg) {
      hideLoader();
      filmGrid.classList.remove('centered');
      filmGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🎬</div><div class="empty-text">${msg}</div></div>`;
    }

    function renderFilms(films, options = {}) {
      const append = !!options.append;
      if (!append) clearFilms();
      if (!films || !films.length) { if (!append) showEmptyState('Фильмы не найдены'); return; }
      const frag = document.createDocumentFragment();
      films.forEach((film, i) => {
        const filmId = film.filmId || film.kinopoiskId;
        const title  = film.nameRu || film.nameEn || 'Без названия';
        const year   = film.year || 'Н/Д';
        const rating = film.rating || film.ratingKinopoisk || 'Н/Д';
        const poster = film.posterUrlPreview || film.posterUrl || '';
        const card   = document.createElement('div');
        card.className = 'film-card';
        card.style.animationDelay = `${i * 0.05}s`;
        card.innerHTML = `
          <img src="${poster}" class="film-poster" alt="${title}" onerror="this.closest('.film-card').remove()">
          <div class="film-info">
            <div class="film-title">${title}</div>
            <div class="film-meta">
              <span>${year}</span>
              ${rating !== 'Н/Д' ? `<span class="rating">⭐ ${rating}</span>` : ''}
            </div>
          </div>`;
        card.onclick = () => openPlayer(filmId, title);
        frag.appendChild(card);
      });
      filmGrid.appendChild(frag);
      hideLoader();
      if (films.length === 1) filmGrid.classList.add('centered');
    }

    function displayFilms(films, forceCenter = false) {
      renderFilms(films, { append: false, forceCenter });
    }

    function openPlayer(filmId, title) {
      window.location.href = `player.html?id=${filmId}&title=${encodeURIComponent(title)}`;
    }

    // ─── Категории ────────────────────────────────────────────────────────
    async function loadCategory(category) {
      currentCategory = category;
      currentPage = 1;
      hasMore = true;
      clearFilms();
      showLoader();
      searchInput.value = '';
      try {
        if (category === 'random') {
          const film = await getRandomFilm();
          film ? displayFilms([film], true) : showEmptyState('Не удалось загрузить случайный фильм');
        } else {
          await loadMoreFilms();
        }
      } catch(e) { showEmptyState('Ошибка загрузки: ' + e.message); }
    }

    async function loadMoreFilms() {
      if (isLoading || !hasMore || !currentCategory) return;
      isLoading = true;
      try {
        let films = [];
        if (currentCategory === 'popular') films = await getPopular(currentPage);
        else if (currentCategory === 'top250') films = await getTop250(currentPage);
        else if (currentCategory === 'new')    films = await getNew(currentPage);
        if (films.length > 0) { renderFilms(films, { append: currentPage > 1 }); currentPage++; }
        else { hasMore = false; if (!filmGrid.children.length) showEmptyState('Фильмы не найдены'); else hideLoader(); }
      } catch(e) { showEmptyState('Ошибка загрузки: ' + e.message); hasMore = false; }
      finally    { isLoading = false; }
    }

    // ─── Поиск с debounce ─────────────────────────────────────────────────
    let searchTimeout;
    searchInput.addEventListener('input', function(e) {
      clearTimeout(searchTimeout);
      const val = e.target.value.trim();
      if (!val || val.length < 2) {
        if (!currentCategory) { content.classList.add('hidden'); clearFilms(); }
        return;
      }
      searchTimeout = setTimeout(async () => {
        currentCategory = null; currentPage = 1; hasMore = false;
        clearFilms(); showLoader();
        try { displayFilms(await searchFilms(val)); }
        catch(e) { showEmptyState('Ошибка поиска: ' + e.message); }
      }, 500);
    });

    // ─── Infinite scroll ──────────────────────────────────────────────────
    let scrollTimeout;
    window.addEventListener('scroll', () => {
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 800 &&
            currentCategory && currentCategory !== 'random' && !isLoading && hasMore) {
          loadMoreFilms();
        }
      }, 100);
    });

    // ─────────────────────────────────────────────────────────────────────
    //  ГОЛОСОВОЙ ВВОД — работает на всех устройствах с поддержкой Web Speech
    //  Fallback: кнопка отображается даже если API недоступен, с объяснением
    // ─────────────────────────────────────────────────────────────────────
    const voiceBtn      = document.getElementById('voiceBtn');
    const voiceTooltip  = document.getElementById('voiceTooltip');
    const voiceTooltipT = document.getElementById('voiceTooltipText');
    const voiceError    = document.getElementById('voiceError');

    // Определяем доступность SpeechRecognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition ||
                              window.mozSpeechRecognition || window.msSpeechRecognition;

    let recognition = null;
    let isListening = false;

    function setVoiceTooltip(text, show) {
      voiceTooltipT.textContent = text;
      voiceTooltip.classList.toggle('visible', show);
    }
    function clearVoiceError() { voiceError.textContent = ''; }
    function showVoiceError(msg) { voiceError.textContent = msg; setTimeout(clearVoiceError, 4000); }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('listening');
        setVoiceTooltip('Говорите...', true);
        clearVoiceError();
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final   = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          event.results[i].isFinal ? (final += t) : (interim += t);
        }
        const display = final || interim;
        if (display) {
          searchInput.value = display;
          setVoiceTooltip('«' + display + '»', true);
        }
        if (final) {
          recognition.stop();
          // Запускаем поиск
          const val = final.trim();
          if (val.length >= 2) {
            currentCategory = null; currentPage = 1; hasMore = false;
            clearFilms(); showLoader();
            searchFilms(val)
              .then(displayFilms)
              .catch(e => showEmptyState('Ошибка поиска: ' + e.message));
          }
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        setVoiceTooltip('', false);
        const errMap = {
          'no-speech':       'Речь не обнаружена. Попробуйте ещё раз.',
          'audio-capture':   'Микрофон недоступен. Проверьте подключение.',
          'not-allowed':     'Доступ к микрофону запрещён. Разрешите в настройках браузера.',
          'network':         'Ошибка сети при распознавании.',
          'aborted':         '',
          'service-not-allowed': 'Браузер запретил использование микрофона.',
        };
        const msg = errMap[event.error] || ('Ошибка распознавания: ' + event.error);
        if (msg) showVoiceError(msg);
      };

      recognition.onend = () => {
        isListening = false;
        voiceBtn.classList.remove('listening');
        setTimeout(() => setVoiceTooltip('', false), 800);
      };

      voiceBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch(e) {
            // Уже запущен — перезапускаем
            try { recognition.stop(); } catch(_) {}
            setTimeout(() => { try { recognition.start(); } catch(_) {} }, 200);
          }
        }
      });

    } else {
      // Web Speech API не поддерживается (старые браузеры / некоторые проекторы)
      // Показываем кнопку, но при нажатии — подсвечиваем текстовое поле
      voiceBtn.title = 'Голосовой ввод недоступен в этом браузере. Используйте текстовый поиск.';
      voiceBtn.style.opacity = '0.4';
      voiceBtn.addEventListener('click', () => {
        searchInput.focus();
        showVoiceError('Голосовой ввод не поддерживается этим браузером. Введите текст вручную.');
      });
    }
  </script>
</body>
</html>
