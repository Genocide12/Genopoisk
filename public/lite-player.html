<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,minimum-scale=1">
  <meta name="referrer" content="origin">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>Плеер — Lite</title>
  <script async src="https://telegram.org/js/telegram-web-app.js"
          onerror="console.log('[tg] telegram-web-app.js unavailable (running outside Telegram Mini App — this is normal)')"></script>
  <style>
    /* ============================================================
       Genopoisk Lite Player
       Та же эстетика, что и основной player.html, но:
       - Меньше CSS, меньше JS — быстрее загружается на проекторе
       - Полная поддержка пульта проектора:
         * Стрелки ← → = перемотка -10/+10 сек
         * Стрелки ↑ ↓ = перемотка -60/+60 сек
         * Space / Enter / MediaPlayPause = play/pause
         * MediaPlay = play, MediaPause = pause
         * MediaStop = stop + return to home
         * Escape / Backspace = back to /lite.html
         * F = fullscreen toggle
         * M = mute toggle
       - Поддержка D-pad навигации между кнопками управления
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0; left: 0;
      overscroll-behavior: none;
    }

    /* Header */
    .player-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101014;
      padding: 14px 16px;
      height: 56px;
      font-size: 16px;
      font-weight: 600;
      z-index: 10;
    }
    .player-header .back-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .player-header .back-btn:hover, .player-header .back-btn:focus-visible {
      background: rgba(255,255,255,0.1);
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .player-header .video-title {
      flex: 1;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 12px;
      font-size: 15px;
    }
    .player-header .fav-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .player-header .fav-btn.active { color: #FFD60A; }
    .player-header .fav-btn:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }

    /* Main player area */
    .player-main {
      position: absolute;
      top: 56px; left: 0; right: 0; bottom: 0;
      background: #000;
    }
    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #1f1f1f;
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      max-width: 80%;
      text-align: center;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 80px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 10px 18px;
      border-radius: 22px;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 8;
      max-width: 90%;
      text-align: center;
    }
    .toast.visible { opacity: 1; }

    /* Remote control help — shows on first press of an unrecognized key */
    .remote-help {
      position: absolute;
      bottom: 16px; left: 16px; right: 16px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #ccc;
      z-index: 6;
      display: none;
    }
    .remote-help.visible { display: block; }
    .remote-help h3 {
      color: #007AFF;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .remote-help .row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    .remote-help .key {
      color: #fff;
      font-weight: 600;
    }

    /* Lite badge */
    .lite-badge {
      position: absolute;
      top: 14px; right: 60px;
      background: rgba(0, 122, 255, 0.2);
      color: #007AFF;
      border: 1px solid #007AFF;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      z-index: 11;
    }
  </style>
</head>
<body>
  <div class="lite-badge">Lite</div>

  <div class="player-header">
    <button class="back-btn" id="backBtn" title="Назад (Esc)">←</button>
    <div class="video-title" id="videoTitle">Загрузка...</div>
    <button class="fav-btn" id="favBtn" title="В избранное">☆</button>
  </div>

  <div class="player-main" id="playerMain">
    <iframe id="playerIframe" class="player-iframe"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            referrerpolicy="origin"></iframe>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-title" id="loadingTitle">Загрузка...</div>
      <div class="loading-subtitle" id="loadingSubtitle"></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="remote-help" id="remoteHelp">
      <h3>🎛️ Управление с пульта</h3>
      <div class="row"><span>◀ ▶</span><span class="key">перемотка ±10 сек</span></div>
      <div class="row"><span>▲ ▼</span><span class="key">перемотка ±60 сек</span></div>
      <div class="row"><span>OK / Space</span><span class="key">play / pause</span></div>
      <div class="row"><span>Back / Esc</span><span class="key">назад</span></div>
      <div class="row"><span>F</span><span class="key">полный экран</span></div>
      <div class="row"><span>M</span><span class="key">выключить звук</span></div>
    </div>
  </div>

  <script>
    'use strict';

    // ====== Parse URL params ======
    var params = new URLSearchParams(window.location.search);
    var kid = params.get('id') || '4910542';
    var title = params.get('title') || 'Фильм';
    var startTime = parseInt(params.get('t') || '0', 10) || 0;

    document.getElementById('videoTitle').textContent = decodeURIComponent(title);
    document.getElementById('loadingTitle').textContent = decodeURIComponent(title);
    if (startTime > 0) {
      document.getElementById('loadingSubtitle').textContent = 'Продолжить с ' + formatTime(startTime);
    }

    var iframe = document.getElementById('playerIframe');
    var loadingOverlay = document.getElementById('loadingOverlay');
    var toastEl = document.getElementById('toast');
    var favBtn = document.getElementById('favBtn');
    var backBtn = document.getElementById('backBtn');
    var remoteHelp = document.getElementById('remoteHelp');

    var isFavorite = false;
    var lastKnownTime = 0;
    var lastKnownDuration = 0;
    var lastSaveTime = 0;
    var lastBackendSaveTime = 0;
    var playerReady = false;
    var toastTimeout = null;
    var helpShown = false;

    // ====== User ID ======
    function getUserId() {
      var tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) return tgId;
      var id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        var rand = Math.random().toString(36).slice(2, 11);
        var time = Date.now().toString(36);
        id = 'web_' + time + '_' + rand;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }
    function getTgInitData() {
      var t = window.Telegram && window.Telegram.WebApp;
      return (t && t.initData) || '';
    }

    function showToast(msg, duration) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toastEl.classList.remove('visible');
      }, duration || 2000);
    }

    function formatTime(s) {
      if (!s || s < 0) s = 0;
      s = Math.floor(s);
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      return m + ':' + String(sec).padStart(2, '0');
    }

    // ====== Send messages to iframe (venoplayer inside) ======
    function sendToPlayer(msg) {
      try {
        iframe.contentWindow.postMessage(typeof msg === 'string' ? msg : JSON.stringify(msg), '*');
      } catch (_) {}
    }

    // ====== Load player ======
    // Fetch /api/embed (which proxies api.embess.ws and injects bridge.js)
    // then write the HTML into the iframe via srcdoc.
    function loadPlayer() {
      fetch('/api/embed?id=' + encodeURIComponent(kid))
        .then(function(res) {
          if (!res.ok) throw new Error('embed fetch failed: ' + res.status);
          return res.text();
        })
        .then(function(html) {
          iframe.srcdoc = html;
          console.log('[player] srcdoc set');
        })
        .catch(function(e) {
          console.error('[player] Load failed:', e.message);
          // Fallback: direct iframe (no resume, but at least plays)
          iframe.src = 'https://api.embess.ws/embed/kp/' + encodeURIComponent(kid);
          loadingOverlay.classList.add('hidden');
          showToast('⚠️ Загружен прямой плеер (без возобновления)');
        });
    }
    loadPlayer();

    // ====== Listen for messages from iframe (bridge.js inside) ======
    window.addEventListener('message', function(event) {
      try {
        var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'ready' || data.type === 'player_ready') {
          playerReady = true;
          loadingOverlay.classList.add('hidden');
          // Seek to resume position
          if (startTime > 5) {
            sendToPlayer({ type: 'seek', time: startTime });
            showToast('▶ Продолжить с ' + formatTime(startTime));
          }
        }
        if (data.type === 'timeupdate' || data.type === 'time') {
          lastKnownTime = data.currentTime || data.time || 0;
          lastKnownDuration = data.duration || 0;
          // Save position locally every 5s
          if (Date.now() - lastSaveTime > 5000) {
            lastSaveTime = Date.now();
            savePosition(lastKnownTime, lastKnownDuration, false);
          }
        }
        if (data.type === 'ended') {
          showToast('🎬 Фильм закончился', 3000);
          // Save final position
          savePosition(lastKnownDuration, lastKnownDuration, true);
        }
        if (data.type === 'error') {
          showToast('⚠️ Ошибка плеера: ' + (data.message || 'неизвестно'), 4000);
        }
      } catch (e) {
        // Not JSON or our format — ignore
      }
    });

    // ====== Save position to backend ======
    function savePosition(position, duration, force) {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) return;
      // Throttle backend saves to once per 15s (unless forced)
      if (!force && Date.now() - lastBackendSaveTime < 15000) return;
      lastBackendSaveTime = Date.now();
      try {
        fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'position_update',
            initData: getTgInitData(),
            userId: uid,
            filmId: kid,
            title: decodeURIComponent(title),
            position: position,
            duration: duration
          })
        }).catch(function() {});
      } catch (e) {}
    }

    // ====== Favorite state ======
    async function loadFavoriteState() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) return;
      try {
        var res = await fetch('/api/my-films', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) return;
        var data = await res.json();
        var favs = data.favorites || [];
        isFavorite = favs.some(function(f) { return String(f.filmId) === String(kid); });
        updateFavBtn();
      } catch (e) {}
    }

    function updateFavBtn() {
      favBtn.textContent = isFavorite ? '★' : '☆';
      favBtn.classList.toggle('active', isFavorite);
      favBtn.title = isFavorite ? 'Убрать из избранного' : 'В избранное';
    }

    async function toggleFavorite() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) {
        showToast('⚠️ Войдите через Telegram, чтобы сохранять фильмы');
        return;
      }
      var wasFav = isFavorite;
      isFavorite = !isFavorite;
      updateFavBtn();
      showToast(isFavorite ? '❤️ Добавлено в коллекцию' : '💔 Убрано из коллекции');
      try {
        await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: isFavorite ? 'favorite_added' : 'favorite_removed',
            initData: getTgInitData(),
            userId: uid,
            filmId: kid,
            title: decodeURIComponent(title)
          })
        });
      } catch (e) {
        // Revert on error
        isFavorite = wasFav;
        updateFavBtn();
        showToast('⚠️ Не удалось сохранить');
      }
    }

    favBtn.addEventListener('click', toggleFavorite);
    favBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleFavorite();
      }
    });

    // ====== Back button ======
    function goHome() {
      // Save final position before leaving
      if (lastKnownTime > 0) {
        savePosition(lastKnownTime, lastKnownDuration, true);
      }
      try { window.location.href = '/lite.html'; } catch (e) {
        try { window.location.replace('/lite.html'); } catch (_) {}
      }
    }
    backBtn.addEventListener('click', goHome);
    backBtn.addEventListener('touchend', function(e) { e.preventDefault(); goHome(); });

    // ====== Keyboard / remote control ======
    // This is the KEY feature for Android projectors — their remotes emit
    // standard keyboard events: ArrowKeys, Enter, Backspace (Back button),
    // and MediaPlay / MediaPause / MediaPlayPause.
    document.addEventListener('keydown', function(e) {
      // If focus is on back button or fav button and key is Enter — let it click
      var active = document.activeElement;
      if ((active === backBtn || active === favBtn) && e.key === 'Enter') {
        return;
      }

      // Show help on first key press
      if (!helpShown) {
        helpShown = true;
        remoteHelp.classList.add('visible');
        setTimeout(function() { remoteHelp.classList.remove('visible'); }, 6000);
      }

      switch (e.key) {
        case 'ArrowLeft':
          e.preventDefault();
          seekBy(-10);
          break;
        case 'ArrowRight':
          e.preventDefault();
          seekBy(10);
          break;
        case 'ArrowUp':
          e.preventDefault();
          seekBy(-60);
          break;
        case 'ArrowDown':
          e.preventDefault();
          seekBy(60);
          break;
        case ' ':
        case 'Enter':
        case 'MediaPlayPause':
          e.preventDefault();
          togglePlayPause();
          break;
        case 'MediaPlay':
          e.preventDefault();
          playVideo();
          break;
        case 'MediaPause':
          e.preventDefault();
          pauseVideo();
          break;
        case 'MediaStop':
          e.preventDefault();
          pauseVideo();
          goHome();
          break;
        case 'Escape':
        case 'Backspace':
          // Back button on Android TV remote
          e.preventDefault();
          goHome();
          break;
        case 'f':
        case 'F':
          e.preventDefault();
          toggleFullscreen();
          break;
        case 'm':
        case 'M':
          e.preventDefault();
          toggleMute();
          break;
        default:
          // Unknown key — log it for debugging
          console.log('[player] Unhandled key:', e.key);
      }
    });

    function seekBy(delta) {
      var newTime = Math.max(0, lastKnownTime + delta);
      if (lastKnownDuration && newTime > lastKnownDuration) {
        newTime = lastKnownDuration;
      }
      sendToPlayer({ type: 'seek', time: newTime });
      lastKnownTime = newTime;
      showToast('⏩ ' + formatTime(newTime) + (lastKnownDuration ? ' / ' + formatTime(lastKnownDuration) : ''));
    }

    function togglePlayPause() {
      sendToPlayer({ type: 'togglePlay' });
      showToast('▶/⏸');
    }
    function playVideo() {
      sendToPlayer({ type: 'play' });
      showToast('▶');
    }
    function pauseVideo() {
      sendToPlayer({ type: 'pause' });
      showToast('⏸');
    }
    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
          showToast('⛶ Полный экран');
        } else {
          document.exitFullscreen();
          showToast('⛌ Выход из полного экрана');
        }
      } catch (e) {
        showToast('⚠️ Полный экран недоступен');
      }
    }
    function toggleMute() {
      sendToPlayer({ type: 'toggleMute' });
      showToast('🔇');
    }

    // ====== Save position periodically ======
    setInterval(function() {
      if (lastKnownTime > 0) {
        savePosition(lastKnownTime, lastKnownDuration, false);
      }
    }, 10000);

    // ====== Save on page unload ======
    window.addEventListener('beforeunload', function() {
      if (lastKnownTime > 0) {
        savePosition(lastKnownTime, lastKnownDuration, true);
      }
    });

    // ====== Auto-hide loading overlay after 8s as fallback ======
    setTimeout(function() {
      if (!loadingOverlay.classList.contains('hidden')) {
        loadingOverlay.classList.add('hidden');
        showToast('⚠️ Плеер долго загружается — возможно, проблема с сетью');
      }
    }, 8000);

    // ====== Telegram WebApp ======
    if (window.Telegram && window.Telegram.WebApp) {
      var tg = window.Telegram.WebApp;
      if (tg.ready) tg.ready();
      if (tg.expand) tg.expand();
      // Telegram BackButton → go home
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
          if (lastKnownTime > 0) savePosition(lastKnownTime, lastKnownDuration, true);
          window.location.href = '/lite.html';
        });
      }
    }

    // ====== Init ======
    loadFavoriteState();
    // Auto-focus back button for D-pad users
    setTimeout(function() {
      if (!('ontouchstart' in window)) {
        backBtn.focus();
      }
    }, 500);
  </script>
</body>
</html>
