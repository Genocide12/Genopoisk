<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genopoisk">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Genopoisk — Lite</title>
  <style>
    /* ============================================================
       Genopoisk Lite — для Android-проекторов, TV-боксов и слабых устройств
       Та же эстетика, что и основной версии, но:
       - Нет holo glow на заголовке (GPU-heavy)
       - Нет mouse-tracking на карточках (проекторы обычно без мыши)
       - Нет анимаций入场 (fade-in, slide-up) — мгновенный рендер
       - Нет long-press popup (нет тача)
       - Минимум CSS-переменных и эффектов
       - Поддержка D-pad навигации (стрелки + Enter)
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 100px; }

    /* Telegram login bar */
    .tg-login-bar {
      display: none;
      background: linear-gradient(135deg, #229ED9 0%, #2AABEE 100%);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tg-login-bar.visible { display: flex; }
    .tg-login-bar a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tg-login-bar .close-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
    }

    /* Hero */
    .hero { text-align: center; padding: 20px 0 16px; }
    .hero-title {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
    }
    .hero-subtitle {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
      min-height: 18px;
    }

    /* Resume card */
    .resume-card {
      display: none;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px;
      margin: 16px 0;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .resume-card.visible { display: flex; }
    .resume-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .resume-poster {
      width: 48px; height: 68px;
      border-radius: 6px;
      object-fit: cover;
      background: #1f1f1f;
    }
    .resume-info { flex: 1; min-width: 0; }
    .resume-label { color: #007AFF; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .resume-title { color: #f5f5f5; font-size: 15px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .resume-meta { color: #888; font-size: 13px; margin-top: 2px; }
    .resume-close {
      background: transparent; border: none; color: #888;
      font-size: 20px; cursor: pointer; padding: 4px 8px;
    }

    /* Search */
    .search-wrapper { margin: 16px 0; }
    .search-container {
      display: flex; align-items: center;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .search-container:focus-within { border-color: #007AFF; }
    .search-icon { font-size: 18px; margin-right: 10px; color: #888; }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f5f5f5; font-size: 16px; font-family: inherit;
    }
    .search-input::placeholder { color: #666; }
    .search-clear {
      background: transparent; border: none; color: #666;
      font-size: 16px; cursor: pointer; padding: 4px 8px;
      display: none;
    }
    .search-clear.visible { display: block; }

    /* Category buttons */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .action-card {
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .action-card:hover { background: #1a1a1a; }
    .action-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .action-card.active {
      border-color: #007AFF;
      background: rgba(0, 122, 255, 0.08);
    }
    .action-icon { font-size: 24px; display: block; }
    .action-title { font-size: 13px; color: #ccc; margin-top: 6px; font-weight: 600; }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      padding: 40px 0;
      color: #888;
    }
    .loader.visible { display: block; }
    .loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid #1f1f1f;
      border-top-color: #007AFF;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Film grid */
    .content.hidden { display: none; }
    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .film-card {
      background: #141414;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s;
    }
    .film-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .film-card:hover { transform: translateY(-2px); }
    .film-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #1f1f1f;
    }
    .film-info { padding: 8px 10px; }
    .film-title {
      font-size: 13px;
      font-weight: 600;
      color: #f5f5f5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .film-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #888;
      margin-top: 4px;
    }
    .film-meta .rating { color: #FFD60A; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 15px;
    }

    /* Error state */
    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: #FF453A;
      font-size: 14px;
    }

    /* Premium badge */
    .premium-badge {
      display: none;
      font-size: 0.6em;
      vertical-align: middle;
      margin-right: 4px;
    }
    .premium-badge.visible { display: inline; }

    /* Fixed bottom bar */
    .fixed-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #007AFF;
      color: #fff;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      z-index: 100;
      display: none;
    }
    .fixed-bottom.visible { display: block; }

    /* D-pad focus ring — visible only when navigating with keyboard */
    .dpad-focused {
      outline: 3px solid #007AFF !important;
      outline-offset: 2px;
    }

    /* Lite version badge — small indicator in corner */
    .lite-badge {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(0, 122, 255, 0.2);
      color: #007AFF;
      border: 1px solid #007AFF;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      z-index: 50;
    }
    .lite-badge a { color: #007AFF; text-decoration: none; }

    /* ====== On-screen D-pad for projectors without keyboard ====== */
    .on-screen-dpad {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 180px;
      height: 180px;
      z-index: 998;
      display: none;
    }
    .on-screen-dpad.visible { display: block; }
    .on-screen-dpad .dpad-btn {
      position: absolute;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.92);
      color: #fff;
      border: 2px solid rgba(0, 122, 255, 0.6);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .on-screen-dpad .dpad-btn:hover, .on-screen-dpad .dpad-btn:focus-visible {
      background: rgba(0, 122, 255, 0.3);
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .on-screen-dpad .dpad-btn:active { transform: scale(0.92); }
    .on-screen-dpad .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
    .on-screen-dpad .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
    .on-screen-dpad .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); }
    .on-screen-dpad .dpad-right { right: 0; top: 50%; transform: translateY(-50%); }
    .on-screen-dpad .dpad-ok {
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: rgba(0, 122, 255, 0.85);
      font-weight: 700;
      font-size: 14px;
    }
    .on-screen-dpad .dpad-toggle {
      position: absolute;
      top: -38px; right: 0;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.92);
      color: #888;
      border: 1px solid #333;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="lite-badge">Lite · <a href="/">полная</a></div>

  <div class="container">
    <!-- Telegram login bar -->
    <div class="tg-login-bar" id="tgLoginBar">
      <a href="/api/auth/telegram/login" id="tgLoginBtn">🤖 Войти через Telegram</a>
      <button class="close-btn" id="tgLoginBarClose" title="Скрыть">✕</button>
    </div>

    <!-- Hero -->
    <div class="hero">
      <h1 class="hero-title" id="heroTitle">
        <span class="premium-badge" id="premiumBadge">🔥</span>Genopoisk
      </h1>
      <p class="hero-subtitle" id="heroSubtitle"></p>
    </div>

    <!-- Resume card -->
    <div class="resume-card" id="resumeCard" tabindex="0">
      <img class="resume-poster" id="resumePoster" src="" alt="">
      <div class="resume-info">
        <div class="resume-label">Продолжить просмотр</div>
        <div class="resume-title" id="resumeTitle">—</div>
        <div class="resume-meta" id="resumeMeta">—</div>
      </div>
      <button class="resume-close" id="resumeClose" title="Скрыть">✕</button>
    </div>

    <!-- Search -->
    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input"
               placeholder="Поиск фильмов..." autocomplete="off"
               enterkeyhint="done" inputmode="search">
        <button class="search-clear" id="searchClear" type="button">✕</button>
      </div>
    </div>

    <!-- Categories -->
    <div class="actions" id="actions">
      <div class="action-card" tabindex="0" data-cat="popular">
        <span class="action-icon">🔥</span>
        <div class="action-title">Популярные</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="top250">
        <span class="action-icon">⭐</span>
        <div class="action-title">Топ 250</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="new">
        <span class="action-icon">🎬</span>
        <div class="action-title">Новинки</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="random">
        <span class="action-icon">🎯</span>
        <div class="action-title">Случайный</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="favorites">
        <span class="action-icon">❤️</span>
        <div class="action-title">Коллекция</div>
      </div>
    </div>

    <!-- Content area -->
    <div class="content" id="content">
      <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div>Загрузка...</div>
      </div>
      <div class="film-grid" id="filmGrid"></div>
    </div>
  </div>

  <!-- Fixed bottom CTA -->
  <a href="https://t.me/Genopoiskbot?start=app" target="_blank" rel="noopener"
     class="fixed-bottom" id="fixedBottom">🤖 Открыть в Telegram</a>

  <!-- On-screen D-pad for projectors / TVs without keyboard -->
  <div class="on-screen-dpad" id="onScreenDpad">
    <button class="dpad-toggle" id="dpadToggle" title="Скрыть D-pad">✕</button>
    <button class="dpad-btn dpad-up"    data-dir="up"    title="Вверх">▲</button>
    <button class="dpad-btn dpad-down"  data-dir="down"  title="Вниз">▼</button>
    <button class="dpad-btn dpad-left"  data-dir="left"  title="Влево">◀</button>
    <button class="dpad-btn dpad-right" data-dir="right" title="Вправо">▶</button>
    <button class="dpad-btn dpad-ok"    data-dir="ok"    title="OK / Выбрать">OK</button>
  </div>

  <script>
    // ============================================================
    // Genopoisk Lite — main JS
    // ============================================================
    'use strict';

    var API_BASE = '/api/kinopoisk';
    var filmGrid = document.getElementById('filmGrid');
    var loader = document.getElementById('loader');
    var content = document.getElementById('content');
    var searchInput = document.getElementById('searchInput');
    var searchClear = document.getElementById('searchClear');
    var actions = document.getElementById('actions');
    var resumeCard = document.getElementById('resumeCard');
    var resumePoster = document.getElementById('resumePoster');
    var resumeTitle = document.getElementById('resumeTitle');
    var resumeMeta = document.getElementById('resumeMeta');
    var resumeClose = document.getElementById('resumeClose');
    var heroTitle = document.getElementById('heroTitle');
    var heroSubtitle = document.getElementById('heroSubtitle');
    var premiumBadge = document.getElementById('premiumBadge');
    var tgLoginBar = document.getElementById('tgLoginBar');
    var tgLoginBarClose = document.getElementById('tgLoginBarClose');
    var fixedBottom = document.getElementById('fixedBottom');

    var currentCategory = null;
    var currentPage = 1;
    var hasMore = true;
    var isLoading = false;
    var searchTimeout = null;
    var currentSearchController = null;
    // Track all focusable elements for D-pad navigation
    var focusableElements = [];

    // ====== User ID (same logic as main version) ======
    function getUserId() {
      var tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) return tgId;
      var id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        var rand = Math.random().toString(36).slice(2, 11);
        var time = Date.now().toString(36);
        id = 'web_' + time + '_' + rand;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }

    function getTgInitData() {
      var t = window.Telegram && window.Telegram.WebApp;
      return (t && t.initData) || '';
    }

    async function trackEvent(type, payload) {
      payload = payload || {};
      try {
        var tgUsername = localStorage.getItem('genopoisk_tg_username') || '';
        await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: type,
            initData: getTgInitData(),
            userId: getUserId(),
            username: tgUsername,
            filmId: payload.filmId,
            title: payload.title,
            position: payload.position,
            duration: payload.duration,
            rating: payload.rating,
            query: payload.query,
            category: payload.category
          })
        });
      } catch (e) { console.warn('track error:', e); }
    }

    // ====== API helpers ======
    // apiGet with automatic retry on 429/403 (Cloudflare IP block).
    // The server already retries with different User-Agents, but if it still
    // fails, we wait 2s and try once more on the client side — by then the
    // Cloudflare rate-limit window may have passed.
    async function apiGet(url) {
      var lastErr = null;
      for (var attempt = 0; attempt < 2; attempt++) {
        try {
          var res = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
          if (res.ok) return await res.json();

          var errData = null;
          try { errData = await res.json(); } catch (_) {}

          // 429 = server tried all keys and failed (likely 403 IP block).
          // 403 = direct block (shouldn't happen through our proxy, but just in case).
          // On these — wait and retry once.
          if ((res.status === 429 || res.status === 403) && attempt === 0) {
            var msg = (errData && errData.message) || ('HTTP ' + res.status);
            lastErr = new Error(msg);
            console.warn('[apiGet] Got ' + res.status + ', retrying in 2s...', msg);
            // Show a friendly hint to the user
            if (filmGrid.children.length === 0) {
              showEmptyState('⏳ Кинопоиск временно недоступен (VPN/блокировка). Пробую ещё раз...');
            }
            await new Promise(function(r) { setTimeout(r, 2000); });
            continue;
          }

          // Other errors — throw immediately
          if (errData && errData.message) throw new Error(errData.message);
          throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        } catch (e) {
          // Network error — retry once
          lastErr = e;
          if (attempt === 0) {
            console.warn('[apiGet] Network error, retrying in 2s:', e.message);
            await new Promise(function(r) { setTimeout(r, 2000); });
            continue;
          }
          throw e;
        }
      }
      throw lastErr || new Error('Request failed');
    }

    function extractFilms(data) {
      if (!data) return [];
      return data.films || data.items || data.results || [];
    }

    async function getPopular(page) {
      page = page || 1;
      var url = API_BASE + '/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=7&ratingTo=10&yearFrom=2020&yearTo=2025&page=' + page;
      return extractFilms(await apiGet(url));
    }

    async function getTop250(page) {
      page = page || 1;
      var url = API_BASE + '/v2.2/films/top?type=TOP_250_BEST_FILMS&page=' + page;
      var d = await apiGet(url);
      var f = extractFilms(d);
      if (f.length === 0) {
        var fb = API_BASE + '/v2.2/films?order=RATING&type=FILM&ratingFrom=8&ratingTo=10&page=' + page;
        return extractFilms(await apiGet(fb));
      }
      return f;
    }

    async function getNew(page) {
      page = page || 1;
      var currentYear = new Date().getFullYear();
      var url = API_BASE + '/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=0&ratingTo=10&yearFrom=' + currentYear + '&yearTo=' + currentYear + '&page=' + page;
      return extractFilms(await apiGet(url));
    }

    async function getRandomFilm() {
      var randomPage = Math.floor(Math.random() * 5) + 1;
      var films = await getTop250(randomPage);
      if (films && films.length > 0) return films[Math.floor(Math.random() * films.length)];
      return null;
    }

    async function searchFilms(query) {
      if (currentSearchController) {
        try { currentSearchController.abort(); } catch (_) {}
      }
      currentSearchController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var url = API_BASE + '/v2.1/films/search-by-keyword?keyword=' + encodeURIComponent(query) + '&page=1';
      try {
        var data = await apiGet(url);
        return extractFilms(data);
      } finally {
        currentSearchController = null;
      }
    }

    // ====== Display ======
    function showLoader() { loader.classList.add('visible'); }
    function hideLoader() { loader.classList.remove('visible'); }
    function clearFilms() { filmGrid.innerHTML = ''; }
    function showEmptyState(msg) {
      clearFilms();
      filmGrid.innerHTML = '<div class="empty-state">' + msg + '</div>';
    }
    function showError(msg) {
      clearFilms();
      filmGrid.innerHTML = '<div class="error-state">' + msg + '</div>';
    }

    function appendFilms(films) {
      if (!films || films.length === 0) {
        if (filmGrid.children.length === 0) showEmptyState('Фильмы не найдены');
        return;
      }
      var frag = document.createDocumentFragment();
      films.forEach(function(film) {
        var filmId = film.filmId || film.kinopoiskId;
        var title = film.nameRu || film.nameEn || 'Без названия';
        var year = film.year || 'Н/Д';
        var rating = film.rating || film.ratingKinopoisk || 'Н/Д';
        var poster = filmId ? '/api/poster?id=' + filmId + '&size=small' : '';
        var card = document.createElement('div');
        card.className = 'film-card';
        card.tabIndex = 0;
        card.dataset.filmId = filmId || '';
        card.dataset.title = title;
        card.innerHTML =
          '<img src="' + poster + '" class="film-poster" alt="' + escapeHtml(title) + '" loading="lazy" decoding="async" onerror="this.classList.add(\'error\');this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%232C2C2E%22 width=%22200%22 height=%22300%22/><text x=%22100%22 y=%22160%22 text-anchor=%22middle%22 fill=%22%2398989D%22 font-size=%2214%22>Нет постера</text></svg>\'">' +
          '<div class="film-info">' +
            '<div class="film-title">' + escapeHtml(title) + '</div>' +
            '<div class="film-meta">' +
              '<span>' + year + '</span>' +
              (rating !== 'Н/Д' ? '<span class="rating">⭐ ' + rating + '</span>' : '') +
            '</div>' +
          '</div>';
        card.onclick = function() { openPlayer(filmId, title); };
        card.onkeydown = function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPlayer(filmId, title);
          }
        };
        frag.appendChild(card);
      });
      filmGrid.appendChild(frag);
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function openPlayer(filmId, title) {
      trackEvent('movies_opened', { filmId: filmId, title: title });
      // Small delay so track event has time to fire before navigation
      setTimeout(function() {
        window.location.href = '/lite-player.html?id=' + filmId + '&title=' + encodeURIComponent(title);
      }, 50);
    }

    // ====== Category loading ======
    async function loadCategory(category) {
      currentCategory = category;
      currentPage = 1;
      hasMore = true;
      clearFilms();
      showLoader();
      searchInput.value = '';
      searchClear.classList.remove('visible');
      trackEvent('categories_opened', { category: category });

      // Highlight active category
      var cards = actions.querySelectorAll('.action-card');
      cards.forEach(function(c) {
        c.classList.toggle('active', c.dataset.cat === category);
      });

      try {
        if (category === 'random') {
          var film = await getRandomFilm();
          if (film) {
            appendFilms([film]);
          } else {
            showEmptyState('Не удалось загрузить случайный фильм');
          }
        } else if (category === 'favorites') {
          await loadFavorites();
        } else {
          await loadMoreFilms();
        }
      } catch (e) {
        showError('Ошибка загрузки: ' + e.message);
      } finally {
        hideLoader();
      }
    }

    async function loadFavorites() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) {
        showEmptyState('Войдите через Telegram, чтобы видеть коллекцию');
        return;
      }
      try {
        var res = await fetch('/api/my-films', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        var favs = data.favorites || [];
        if (favs.length === 0) {
          showEmptyState('В коллекции пока пусто. Нажмите ❤️ в плеере, чтобы добавить фильм.');
          return;
        }
        appendFilms(favs.map(function(f) {
          return { filmId: f.filmId, nameRu: f.title, year: '—', rating: 'Н/Д' };
        }));
      } catch (e) {
        showError('Ошибка: ' + e.message);
      }
    }

    async function loadMoreFilms() {
      if (isLoading || !hasMore || !currentCategory) return;
      if (currentCategory === 'favorites' || currentCategory === 'random') return;
      isLoading = true;
      showLoader();
      try {
        var films = [];
        if (currentCategory === 'popular') films = await getPopular(currentPage);
        else if (currentCategory === 'top250') films = await getTop250(currentPage);
        else if (currentCategory === 'new') films = await getNew(currentPage);

        if (films.length > 0) {
          currentPage++;
          appendFilms(films);
        } else {
          hasMore = false;
          if (filmGrid.children.length === 0) showEmptyState('Больше нет фильмов');
        }
      } catch (e) {
        showError('Ошибка: ' + e.message);
      } finally {
        isLoading = false;
        hideLoader();
      }
    }

    // ====== Resume card ======
    async function loadResumeCard() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) return;
      try {
        var res = await fetch('/api/last-film', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) return;
        var data = await res.json();
        if (data && data.film) {
          resumeTitle.textContent = data.film.title || '—';
          var pos = data.film.position || 0;
          var dur = data.film.duration || 0;
          resumeMeta.textContent = formatResumeTime(pos) + (dur ? ' / ' + formatResumeTime(dur) : '');
          if (data.film.filmId) {
            resumePoster.src = '/api/poster?id=' + data.film.filmId + '&size=small';
            resumePoster.style.display = 'block';
          }
          resumeCard.classList.add('visible');
          resumeCard.onclick = function() {
            var t = pos > 5 ? '&t=' + Math.floor(pos) : '';
            window.location.href = '/lite-player.html?id=' + data.film.filmId + '&title=' + encodeURIComponent(data.film.title) + t;
          };
        }
      } catch (e) { console.warn('resume load failed:', e); }
    }

    function formatResumeTime(s) {
      if (!s || s < 0) s = 0;
      s = Math.floor(s);
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      return m + ':' + String(sec).padStart(2, '0');
    }

    // ====== Premium badge ======
    async function checkPremiumStatus() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) return;
      try {
        var res = await fetch('/api/my-films', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) return;
        var data = await res.json();
        if (data.is_premium) {
          premiumBadge.classList.add('visible');
        }
      } catch (e) {}
    }

    // ====== Telegram login bar ======
    function checkTgLoginBar() {
      var tgId = localStorage.getItem('genopoisk_tg_user_id');
      var dismissed = sessionStorage.getItem('genopoisk_tg_login_dismissed');
      var isMiniApp = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
      if (isMiniApp || dismissed) {
        tgLoginBar.classList.remove('visible');
        return;
      }
      if (tgId) {
        // Logged in — change content to "Open in Telegram"
        tgLoginBar.innerHTML =
          '<a href="https://t.me/Genopoiskbot?start=app" target="_blank" rel="noopener">🤖 Открыть в Telegram</a>' +
          '<button class="close-btn" id="tgLoginBarClose" title="Скрыть">✕</button>';
        document.getElementById('tgLoginBarClose').onclick = function() {
          sessionStorage.setItem('genopoisk_tg_login_dismissed', '1');
          tgLoginBar.classList.remove('visible');
        };
      }
      tgLoginBar.classList.add('visible');
    }

    // Parse URL params from OIDC callback (?telegram_login=success&tg_id=...&tg_name=...)
    function handleTgLoginRedirect() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('telegram_login') === 'success') {
        var tgId = params.get('tg_id');
        var tgName = params.get('tg_name');
        var tgUsername = params.get('tg_username');
        if (tgId) localStorage.setItem('genopoisk_tg_user_id', tgId);
        if (tgName) localStorage.setItem('genopoisk_tg_display_name', tgName);
        if (tgUsername) localStorage.setItem('genopoisk_tg_username', tgUsername);
        // Clean URL
        window.history.replaceState({}, document.title, '/lite.html');
      } else if (params.get('telegram_login') === 'error') {
        heroSubtitle.textContent = '⚠️ Не удалось войти через Telegram';
      }
    }

    // ====== D-pad navigation (for projectors / TV remotes / keyboards) ======
    // Listen for arrow keys, Enter, Escape, Backspace.
    // Maintain a list of focusable elements: action cards, film cards, search input.
    function refreshFocusableList() {
      focusableElements = Array.from(document.querySelectorAll(
        '.action-card, .film-card, .resume-card, .search-input, .search-clear, #tgLoginBtn'
      )).filter(function(el) {
        return el.offsetParent !== null; // visible
      });
    }

    function getFocusedIndex() {
      var active = document.activeElement;
      for (var i = 0; i < focusableElements.length; i++) {
        if (focusableElements[i] === active) return i;
      }
      return -1;
    }

    function findNearestFocusable(direction) {
      refreshFocusableList();
      if (focusableElements.length === 0) return null;
      var idx = getFocusedIndex();
      if (idx === -1) return focusableElements[0];

      var active = focusableElements[idx];
      var rect = active.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;

      var best = null;
      var bestDist = Infinity;
      for (var i = 0; i < focusableElements.length; i++) {
        if (i === idx) continue;
        var el = focusableElements[i];
        var r = el.getBoundingClientRect();
        var ex = r.left + r.width / 2;
        var ey = r.top + r.height / 2;
        var dx = ex - cx;
        var dy = ey - cy;
        // Filter by direction
        if (direction === 'up' && dy >= 0) continue;
        if (direction === 'down' && dy <= 0) continue;
        if (direction === 'left' && dx >= 0) continue;
        if (direction === 'right' && dx <= 0) continue;
        // Distance (with vertical bias for left/right, horizontal for up/down)
        var dist;
        if (direction === 'up' || direction === 'down') {
          dist = Math.abs(dy) + Math.abs(dx) * 2;
        } else {
          dist = Math.abs(dx) + Math.abs(dy) * 2;
        }
        if (dist < bestDist) {
          bestDist = dist;
          best = el;
        }
      }
      return best;
    }

    function setupKeyboardNav() {
      document.addEventListener('keydown', function(e) {
        // Don't intercept if user is typing in search and not pressing arrow keys
        // that would move focus out of the input
        if (e.target === searchInput) {
          if (e.key === 'Escape') {
            searchInput.blur();
            e.preventDefault();
          }
          return;
        }

        var target = null;
        switch (e.key) {
          case 'ArrowUp':    target = findNearestFocusable('up');    break;
          case 'ArrowDown':  target = findNearestFocusable('down');  break;
          case 'ArrowLeft':  target = findNearestFocusable('left');  break;
          case 'ArrowRight': target = findNearestFocusable('right'); break;
          case 'Escape':
          case 'Backspace':
            // Back button on Android TV remote usually sends Backspace or Escape
            // If on a film card, scroll to top; if at top, go back to categories
            if (currentCategory || filmGrid.children.length > 0) {
              currentCategory = null;
              clearFilms();
              content.classList.add('hidden');
              var firstCard = actions.querySelector('.action-card');
              if (firstCard) firstCard.focus();
              // Remove active highlight
              var cards = actions.querySelectorAll('.action-card');
              cards.forEach(function(c) { c.classList.remove('active'); });
              e.preventDefault();
            }
            return;
          case 'Enter':
            // Let native click fire on focused element
            return;
          default:
            return;
        }
        if (target) {
          target.focus();
          target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          e.preventDefault();
        }
      });
    }

    // ====== Infinite scroll (lazy load more pages) ======
    function setupInfiniteScroll() {
      var scrollTimeout;
      window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
          var scrollPos = window.innerHeight + window.scrollY;
          var threshold = document.documentElement.scrollHeight - 800;
          if (scrollPos >= threshold && currentCategory &&
              currentCategory !== 'random' && currentCategory !== 'favorites' &&
              !isLoading && hasMore) {
            loadMoreFilms();
          }
        }, 150);
      }, { passive: true });
    }

    // ====== Event listeners ======
    function setupEventListeners() {
      // Category cards
      actions.querySelectorAll('.action-card').forEach(function(card) {
        card.addEventListener('click', function() {
          loadCategory(card.dataset.cat);
        });
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadCategory(card.dataset.cat);
          }
        });
      });

      // Search input
      searchInput.addEventListener('input', function(e) {
        var val = e.target.value.trim();
        searchClear.classList.toggle('visible', val.length > 0);
        clearTimeout(searchTimeout);
        if (!val || val.length < 2) {
          // Too short — show categories
          if (!currentCategory) {
            content.classList.add('hidden');
            clearFilms();
          }
          return;
        }
        searchTimeout = setTimeout(async function() {
          currentCategory = null;
          currentPage = 1;
          hasMore = false;
          clearFilms();
          content.classList.remove('hidden');
          showLoader();
          trackEvent('searches', { query: val });
          try {
            var films = await searchFilms(val);
            appendFilms(films);
          } catch (e) {
            showError('Ошибка поиска: ' + e.message);
          } finally {
            hideLoader();
          }
        }, 250);
      });

      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchInput.blur();
        }
      });

      searchClear.addEventListener('click', function() {
        searchInput.value = '';
        searchClear.classList.remove('visible');
        currentCategory = null;
        clearFilms();
        content.classList.add('hidden');
        searchInput.focus();
      });

      // Resume card close
      resumeClose.addEventListener('click', function(e) {
        e.stopPropagation();
        resumeCard.classList.remove('visible');
        sessionStorage.setItem('genopoisk_resume_dismissed', '1');
      });

      // Hero title click — cycle themes (kept for parity, but no glow effect)
      heroTitle.addEventListener('click', function() {
        var themes = ['dark', 'light', 'night'];
        var current = localStorage.getItem('genopoisk_theme') || 'dark';
        var idx = themes.indexOf(current);
        var next = themes[(idx + 1) % themes.length];
        localStorage.setItem('genopoisk_theme', next);
        applyTheme(next);
      });

      // Telegram login bar close (initial state)
      tgLoginBarClose.addEventListener('click', function() {
        sessionStorage.setItem('genopoisk_tg_login_dismissed', '1');
        tgLoginBar.classList.remove('visible');
      });
    }

    function applyTheme(theme) {
      document.body.style.background = theme === 'light' ? '#f5f5f5' : theme === 'night' ? '#0a0a1a' : '#000';
      document.body.style.color = theme === 'light' ? '#000' : '#f5f5f5';
    }

    // ====== Init ======
    function init() {
      handleTgLoginRedirect();
      applyTheme(localStorage.getItem('genopoisk_theme') || 'dark');
      checkTgLoginBar();
      setupEventListeners();
      setupKeyboardNav();
      setupOnScreenDpad();
      setupInfiniteScroll();
      bustServiceWorkerCache();

      // Telegram WebApp setup
      if (window.Telegram && window.Telegram.WebApp) {
        var tg = window.Telegram.WebApp;
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
      }

      // Load resume card + premium status (async, don't block render)
      loadResumeCard();
      checkPremiumStatus();

      // Show fixed bottom CTA only on mobile phones (small touch screens).
      // Projectors / TVs / desktops never see it — it just clutters the screen
      // and gets in the way of D-pad navigation.
      var isMobilePhone = ('ontouchstart' in window) && window.innerWidth < 768;
      if (isMobilePhone) {
        fixedBottom.classList.add('visible');
      }

      // Auto-focus first category for D-pad users
      setTimeout(function() {
        var firstCard = actions.querySelector('.action-card');
        if (firstCard && !window.Telegram) {
          // Don't auto-focus inside Telegram Mini App (would pop keyboard on mobile)
          // but DO auto-focus on projector/TV (no touch, has keyboard/remote)
          if (!('ontouchstart' in window)) {
            firstCard.focus();
          }
        }
      }, 500);
    }

    // ====== On-screen D-pad (for projectors without keyboard) ======
    // Many Android projectors' remotes emulate a MOUSE, not a keyboard.
    // For those, we show an on-screen D-pad with clickable buttons that
    // dispatch synthetic keydown events to reuse setupKeyboardNav() above.
    function setupOnScreenDpad() {
      var dpad = document.getElementById('onScreenDpad');
      var toggle = document.getElementById('dpadToggle');
      if (!dpad) return;

      // Detect TV/projector
      function detectTV() {
        var ua = (navigator.userAgent || '').toLowerCase();
        var patterns = ['tv', 'television', 'googletv', 'android tv', 'smarttv', 'smart tv',
                        'projector', 'bravia', 'webos', 'tizen', 'hbbtv', 'roku', 'firetv',
                        'aftt', 'aftm', 'bento'];
        for (var i = 0; i < patterns.length; i++) {
          if (ua.indexOf(patterns[i]) !== -1) return true;
        }
        var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        return !hasTouch && window.innerWidth >= 1280;
      }

      // Check URL params and sessionStorage
      var urlParams = new URLSearchParams(window.location.search);
      var dpadParam = urlParams.get('dpad');
      var dismissed = sessionStorage.getItem('genopoisk_dpad_dismissed');
      var isInTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

      var shouldShow = false;
      if (dpadParam === '1') shouldShow = true;
      else if (dpadParam === '0' || dismissed || isInTelegram) shouldShow = false;
      else shouldShow = detectTV();

      if (shouldShow) {
        dpad.classList.add('visible');
      }

      // Close button
      toggle.addEventListener('click', function() {
        dpad.classList.remove('visible');
        sessionStorage.setItem('genopoisk_dpad_dismissed', '1');
      });

      // Toggle with 'D' key
      document.addEventListener('keydown', function(e) {
        if ((e.key === 'd' || e.key === 'D') &&
            !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName)) {
          dpad.classList.toggle('visible');
        }
      });

      // Wire up buttons — dispatch synthetic KeyboardEvent
      var buttons = dpad.querySelectorAll('.dpad-btn');
      var keyMap = {
        up: 'ArrowUp', down: 'ArrowDown',
        left: 'ArrowLeft', right: 'ArrowRight', ok: 'Enter'
      };
      buttons.forEach(function(btn) {
        var keyName = keyMap[btn.dataset.dir];
        if (!keyName) return;
        function fire(e) {
          e.preventDefault();
          var keyCode = keyName === 'Enter' ? 13 :
            keyName === 'ArrowUp' ? 38 :
            keyName === 'ArrowDown' ? 40 :
            keyName === 'ArrowLeft' ? 37 :
            keyName === 'ArrowRight' ? 39 : 0;
          var ev = new KeyboardEvent('keydown', {
            key: keyName, code: keyName, keyCode: keyCode,
            bubbles: true, cancelable: true, view: window
          });
          document.dispatchEvent(ev);
        }
        btn.addEventListener('click', fire);
        btn.addEventListener('touchend', function(e) { e.preventDefault(); fire(e); });
      });
    }

    // ====== Service Worker cache busting ======
    // Bump SW version detection — if /sw.js version changed since last visit,
    // unregister all SWs and clear caches so the new code takes over immediately.
    function bustServiceWorkerCache() {
      if (!('serviceWorker' in navigator)) return;
      fetch('/sw.js', { cache: 'no-store' })
        .then(function(res) { return res.ok ? res.text() : null; })
        .then(function(text) {
          if (!text) return;
          var m = text.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
          if (!m) return;
          var currentVersion = m[1];
          var lastSeen = localStorage.getItem('genopoisk_sw_version_seen');
          if (lastSeen && lastSeen !== currentVersion) {
            console.log('[sw-bust] SW version changed:', lastSeen, '→', currentVersion);
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
          }
          localStorage.setItem('genopoisk_sw_version_seen', currentVersion);
        })
        .catch(function() {});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
