<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genopoisk">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Genopoisk — Lite</title>
  <style>
    /* ============================================================
       Genopoisk Lite — для Android-проекторов, TV-боксов и слабых устройств
       Та же эстетика, что и основной версии, но:
       - Нет holo glow на заголовке (GPU-heavy)
       - Нет mouse-tracking на карточках (проекторы обычно без мыши)
       - Нет анимаций入场 (fade-in, slide-up) — мгновенный рендер
       - Нет long-press popup (нет тача)
       - Минимум CSS-переменных и эффектов
       - Поддержка D-pad навигации (стрелки + Enter)
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 100px; }

    /* Hero */
    .hero { text-align: center; padding: 20px 0 16px; }
    .hero-title {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      outline-offset: 4px;
    }
    .hero-title:focus, .hero-title:focus-visible {
      outline: 3px solid #007AFF;
      background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
      min-height: 18px;
    }

    /* Resume card */
    .resume-card {
      display: none;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px;
      margin: 16px 0;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .resume-card.visible { display: flex; }
    .resume-card:focus, .resume-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .resume-poster {
      width: 48px; height: 68px;
      border-radius: 6px;
      object-fit: cover;
      background: #1f1f1f;
    }
    .resume-info { flex: 1; min-width: 0; }
    .resume-label { color: #007AFF; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .resume-title { color: #f5f5f5; font-size: 15px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .resume-meta { color: #888; font-size: 13px; margin-top: 2px; }
    .resume-close {
      background: transparent; border: none; color: #888;
      font-size: 20px; cursor: pointer; padding: 4px 8px;
    }

    /* Search */
    .search-wrapper { margin: 16px 0; }
    .search-container {
      display: flex; align-items: center;
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .search-container:focus-within { border-color: #007AFF; }
    .search-icon { font-size: 18px; margin-right: 10px; color: #888; }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f5f5f5; font-size: 16px; font-family: inherit;
    }
    .search-input::placeholder { color: #666; }
    .search-clear {
      background: transparent; border: none; color: #666;
      font-size: 16px; cursor: pointer; padding: 4px 8px;
      display: none;
    }
    .search-clear.visible { display: block; }

    /* Category buttons */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .action-card {
      background: #141414;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .action-card:hover { background: #1a1a1a; }
    .action-card:focus, .action-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .action-card.active {
      border-color: #007AFF;
      background: rgba(0, 122, 255, 0.08);
    }
    .action-icon { font-size: 24px; display: block; }
    .action-title { font-size: 13px; color: #ccc; margin-top: 6px; font-weight: 600; }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      padding: 40px 0;
      color: #888;
    }
    .loader.visible { display: block; }
    .loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid #1f1f1f;
      border-top-color: #007AFF;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Film grid */
    .content.hidden { display: none; }
    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .film-card {
      background: #141414;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s;
    }
    .film-card:focus, .film-card:focus-visible {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    .film-card:hover { transform: translateY(-2px); }
    .film-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #1f1f1f;
    }
    .film-info { padding: 8px 10px; }
    .film-title {
      font-size: 13px;
      font-weight: 600;
      color: #f5f5f5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .film-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #888;
      margin-top: 4px;
    }
    .film-meta .rating { color: #FFD60A; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 15px;
    }

    /* Error state */
    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: #FF453A;
      font-size: 14px;
    }

    /* Premium badge */
    .premium-badge {
      display: none;
      font-size: 0.6em;
      vertical-align: middle;
      margin-right: 4px;
    }
    .premium-badge.visible { display: inline; }

    /* D-pad focus ring — visible only when navigating with keyboard */
    .dpad-focused {
      outline: 3px solid #007AFF !important;
      outline-offset: 2px;
    }

    /* Global focus ring — visible on ALL focused elements (not just
       :focus-visible). This is essential for projector remotes that
       emulate a mouse: when user clicks an element with the remote
       cursor, the element receives focus and the ring must be visible
       so user knows where focus is. */
    *:focus {
      outline: 2px solid #007AFF;
      outline-offset: 2px;
    }
    /* But don't show outline on the body itself (only on real focusable
       elements like buttons, links, inputs, [tabindex]) */
    body:focus { outline: none; }
    /* Stronger outline for elements with explicit tabindex */
    [tabindex]:focus, button:focus, a:focus, input:focus {
      outline: 3px solid #007AFF;
      outline-offset: 2px;
    }

    /* ====== Hide system cursor + auto-focus on mousemove ====== */
    /* Projector remotes move a system cursor — but we want the user to
       see the BLUE FOCUS RING, not the cursor. So we:
       1. Hide the system cursor (cursor: none)
       2. On mousemove, find the nearest focusable element and focus it
       3. The blue ring follows the cursor automatically
       User clicks OK on remote = mouse click = activates focused element. */
    body.cursor-hidden {
      cursor: none !important;
    }
    body.cursor-hidden * {
      cursor: none !important;
    }
    /* Custom pointer — small dot that shows where the system cursor is,
       so user has a fallback if focus doesn't catch up */
    .focus-cursor {
      position: fixed;
      width: 24px; height: 24px;
      border: 2px solid #007AFF;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: opacity 0.15s;
      opacity: 0;
      background: rgba(0, 122, 255, 0.15);
    }
    .focus-cursor.visible { opacity: 1; }

    /* Lite version badge — small indicator in corner */
    .lite-badge {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(0, 122, 255, 0.2);
      color: #007AFF;
      border: 1px solid #007AFF;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lite-badge a { color: #007AFF; text-decoration: none; }
    .lite-badge .saved-indicator {
      background: #34C759;
      color: #fff;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }

    /* "Is this a projector?" prompt — shown once per device if auto-detection
       is uncertain (e.g., Android tablet that might be a projector). */
    .projector-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #007AFF;
      border-radius: 12px;
      padding: 14px 18px;
      color: #f5f5f5;
      font-size: 14px;
      z-index: 200;
      display: none;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }
    .projector-prompt.visible { display: block; }
    .projector-prompt .prompt-text {
      margin-bottom: 10px;
    }
    .projector-prompt .prompt-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .projector-prompt button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
    }
    .projector-prompt .btn-yes {
      background: #007AFF;
      color: #fff;
    }
    .projector-prompt .btn-no {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
    }
  </style>
</head>
<body>
  <!-- Custom focus cursor — replaces the system cursor on projectors.
       Shows a blue ring at the cursor position, and the actual focus
       ring is on the nearest focusable element. -->
  <div class="focus-cursor" id="focusCursor"></div>

  <div class="lite-badge" id="liteBadge">
    Lite · <a href="/?device=desktop">полная</a>
    <span class="saved-indicator" id="savedIndicator" style="display:none">✓ проектор</span>
  </div>

  <!-- "Is this a projector?" prompt — shown if device is Android and not
       yet saved as projector. User can confirm or dismiss. -->
  <div class="projector-prompt" id="projectorPrompt">
    <div class="prompt-text">📺 Это проектор или телевизор?<br><small style="color:#888">Запомним устройство, чтобы всегда открывать Lite-версию.</small></div>
    <div class="prompt-buttons">
      <button class="btn-no" id="promptNo">Нет</button>
      <button class="btn-yes" id="promptYes">Да, это проектор</button>
    </div>
  </div>

  <div class="container">
    <!-- Hero -->
    <div class="hero">
      <h1 class="hero-title" id="heroTitle" tabindex="0">
        <span class="premium-badge" id="premiumBadge">🔥</span>Genopoisk
      </h1>
      <p class="hero-subtitle" id="heroSubtitle"></p>
    </div>

    <!-- Resume card -->
    <div class="resume-card" id="resumeCard" tabindex="0">
      <img class="resume-poster" id="resumePoster" src="" alt="">
      <div class="resume-info">
        <div class="resume-label">Продолжить просмотр</div>
        <div class="resume-title" id="resumeTitle">—</div>
        <div class="resume-meta" id="resumeMeta">—</div>
      </div>
      <button class="resume-close" id="resumeClose" title="Скрыть">✕</button>
    </div>

    <!-- Search -->
    <div class="search-wrapper">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input"
               placeholder="Поиск фильмов..." autocomplete="off"
               enterkeyhint="done" inputmode="search">
        <button class="search-clear" id="searchClear" type="button">✕</button>
      </div>
    </div>

    <!-- Categories -->
    <div class="actions" id="actions">
      <div class="action-card" tabindex="0" data-cat="popular">
        <span class="action-icon">🔥</span>
        <div class="action-title">Популярные</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="top250">
        <span class="action-icon">⭐</span>
        <div class="action-title">Топ 250</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="new">
        <span class="action-icon">🎬</span>
        <div class="action-title">Новинки</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="random">
        <span class="action-icon">🎯</span>
        <div class="action-title">Случайный</div>
      </div>
      <div class="action-card" tabindex="0" data-cat="favorites">
        <span class="action-icon">❤️</span>
        <div class="action-title">Коллекция</div>
      </div>
    </div>

    <!-- Content area -->
    <div class="content" id="content">
      <div class="loader" id="loader">
        <div class="loader-spinner"></div>
        <div>Загрузка...</div>
      </div>
      <div class="film-grid" id="filmGrid"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // Genopoisk Lite — main JS
    // ============================================================
    'use strict';

    var API_BASE = '/api/kinopoisk';
    var filmGrid = document.getElementById('filmGrid');
    var loader = document.getElementById('loader');
    var content = document.getElementById('content');
    var searchInput = document.getElementById('searchInput');
    var searchClear = document.getElementById('searchClear');
    var actions = document.getElementById('actions');
    var resumeCard = document.getElementById('resumeCard');
    var resumePoster = document.getElementById('resumePoster');
    var resumeTitle = document.getElementById('resumeTitle');
    var resumeMeta = document.getElementById('resumeMeta');
    var resumeClose = document.getElementById('resumeClose');
    var heroTitle = document.getElementById('heroTitle');
    var heroSubtitle = document.getElementById('heroSubtitle');
    var premiumBadge = document.getElementById('premiumBadge');
    // Note: tgLoginBar and fixedBottom Telegram CTAs were removed from lite
    // version — projectors don't need them. User can still log in via the
    // main site (lite-badge → "полная") if needed.

    var currentCategory = null;
    var currentPage = 1;
    var hasMore = true;
    var isLoading = false;
    var searchTimeout = null;
    var currentSearchController = null;
    // Track all focusable elements for D-pad navigation
    var focusableElements = [];

    // ====== User ID (same logic as main version) ======
    function getUserId() {
      var tgId = localStorage.getItem('genopoisk_tg_user_id');
      if (tgId) return tgId;
      var id = localStorage.getItem('genopoisk_user_id');
      if (!id) {
        var rand = Math.random().toString(36).slice(2, 11);
        var time = Date.now().toString(36);
        id = 'web_' + time + '_' + rand;
        localStorage.setItem('genopoisk_user_id', id);
      }
      return id;
    }

    function getTgInitData() {
      var t = window.Telegram && window.Telegram.WebApp;
      return (t && t.initData) || '';
    }

    async function trackEvent(type, payload) {
      payload = payload || {};
      try {
        var tgUsername = localStorage.getItem('genopoisk_tg_username') || '';
        await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: type,
            initData: getTgInitData(),
            userId: getUserId(),
            username: tgUsername,
            filmId: payload.filmId,
            title: payload.title,
            position: payload.position,
            duration: payload.duration,
            rating: payload.rating,
            query: payload.query,
            category: payload.category
          })
        });
      } catch (e) { console.warn('track error:', e); }
    }

    // ====== API helpers ======
    // apiGet with automatic retry on 429/403 (Cloudflare IP block).
    // The server already retries with different User-Agents, but if it still
    // fails, we wait 2s and try once more on the client side — by then the
    // Cloudflare rate-limit window may have passed.
    async function apiGet(url) {
      var lastErr = null;
      for (var attempt = 0; attempt < 2; attempt++) {
        try {
          var res = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
          if (res.ok) return await res.json();

          var errData = null;
          try { errData = await res.json(); } catch (_) {}

          // 429 = server tried all keys and failed (likely 403 IP block).
          // 403 = direct block (shouldn't happen through our proxy, but just in case).
          // On these — wait and retry once.
          if ((res.status === 429 || res.status === 403) && attempt === 0) {
            var msg = (errData && errData.message) || ('HTTP ' + res.status);
            lastErr = new Error(msg);
            console.warn('[apiGet] Got ' + res.status + ', retrying in 2s...', msg);
            // Show a friendly hint to the user
            if (filmGrid.children.length === 0) {
              showEmptyState('⏳ Кинопоиск временно недоступен (VPN/блокировка). Пробую ещё раз...');
            }
            await new Promise(function(r) { setTimeout(r, 2000); });
            continue;
          }

          // Other errors — throw immediately
          if (errData && errData.message) throw new Error(errData.message);
          throw new Error('HTTP ' + res.status + ': ' + res.statusText);
        } catch (e) {
          // Network error — retry once
          lastErr = e;
          if (attempt === 0) {
            console.warn('[apiGet] Network error, retrying in 2s:', e.message);
            await new Promise(function(r) { setTimeout(r, 2000); });
            continue;
          }
          throw e;
        }
      }
      throw lastErr || new Error('Request failed');
    }

    function extractFilms(data) {
      if (!data) return [];
      return data.films || data.items || data.results || [];
    }

    async function getPopular(page) {
      page = page || 1;
      var url = API_BASE + '/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=7&ratingTo=10&yearFrom=2020&yearTo=2025&page=' + page;
      return extractFilms(await apiGet(url));
    }

    async function getTop250(page) {
      page = page || 1;
      var url = API_BASE + '/v2.2/films/top?type=TOP_250_BEST_FILMS&page=' + page;
      var d = await apiGet(url);
      var f = extractFilms(d);
      if (f.length === 0) {
        var fb = API_BASE + '/v2.2/films?order=RATING&type=FILM&ratingFrom=8&ratingTo=10&page=' + page;
        return extractFilms(await apiGet(fb));
      }
      return f;
    }

    async function getNew(page) {
      page = page || 1;
      var currentYear = new Date().getFullYear();
      var url = API_BASE + '/v2.2/films?order=NUM_VOTE&type=FILM&ratingFrom=0&ratingTo=10&yearFrom=' + currentYear + '&yearTo=' + currentYear + '&page=' + page;
      return extractFilms(await apiGet(url));
    }

    async function getRandomFilm() {
      var randomPage = Math.floor(Math.random() * 5) + 1;
      var films = await getTop250(randomPage);
      if (films && films.length > 0) return films[Math.floor(Math.random() * films.length)];
      return null;
    }

    async function searchFilms(query) {
      if (currentSearchController) {
        try { currentSearchController.abort(); } catch (_) {}
      }
      currentSearchController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var url = API_BASE + '/v2.1/films/search-by-keyword?keyword=' + encodeURIComponent(query) + '&page=1';
      try {
        var data = await apiGet(url);
        return extractFilms(data);
      } finally {
        currentSearchController = null;
      }
    }

    // ====== Display ======
    function showLoader() { loader.classList.add('visible'); }
    function hideLoader() { loader.classList.remove('visible'); }
    function clearFilms() { filmGrid.innerHTML = ''; }
    function showEmptyState(msg) {
      clearFilms();
      filmGrid.innerHTML = '<div class="empty-state">' + msg + '</div>';
    }
    function showError(msg) {
      clearFilms();
      filmGrid.innerHTML = '<div class="error-state">' + msg + '</div>';
    }

    function appendFilms(films) {
      if (!films || films.length === 0) {
        if (filmGrid.children.length === 0) showEmptyState('Фильмы не найдены');
        return;
      }
      var frag = document.createDocumentFragment();
      films.forEach(function(film) {
        var filmId = film.filmId || film.kinopoiskId;
        var title = film.nameRu || film.nameEn || 'Без названия';
        var year = film.year || 'Н/Д';
        var rating = film.rating || film.ratingKinopoisk || 'Н/Д';
        var poster = filmId ? '/api/poster?id=' + filmId + '&size=small' : '';
        var card = document.createElement('div');
        card.className = 'film-card';
        card.tabIndex = 0;
        card.dataset.filmId = filmId || '';
        card.dataset.title = title;
        card.innerHTML =
          '<img src="' + poster + '" class="film-poster" alt="' + escapeHtml(title) + '" loading="lazy" decoding="async" onerror="this.classList.add(\'error\');this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%232C2C2E%22 width=%22200%22 height=%22300%22/><text x=%22100%22 y=%22160%22 text-anchor=%22middle%22 fill=%22%2398989D%22 font-size=%2214%22>Нет постера</text></svg>\'">' +
          '<div class="film-info">' +
            '<div class="film-title">' + escapeHtml(title) + '</div>' +
            '<div class="film-meta">' +
              '<span>' + year + '</span>' +
              (rating !== 'Н/Д' ? '<span class="rating">⭐ ' + rating + '</span>' : '') +
            '</div>' +
          '</div>';
        card.onclick = function() { openPlayer(filmId, title); };
        card.onkeydown = function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPlayer(filmId, title);
          }
        };
        frag.appendChild(card);
      });
      filmGrid.appendChild(frag);
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function openPlayer(filmId, title) {
      trackEvent('movies_opened', { filmId: filmId, title: title });
      // Small delay so track event has time to fire before navigation
      setTimeout(function() {
        window.location.href = '/lite-player.html?id=' + filmId + '&title=' + encodeURIComponent(title);
      }, 50);
    }

    // ====== Category loading ======
    async function loadCategory(category) {
      currentCategory = category;
      currentPage = 1;
      hasMore = true;
      clearFilms();
      showLoader();
      searchInput.value = '';
      searchClear.classList.remove('visible');
      trackEvent('categories_opened', { category: category });

      // Highlight active category
      var cards = actions.querySelectorAll('.action-card');
      cards.forEach(function(c) {
        c.classList.toggle('active', c.dataset.cat === category);
      });

      try {
        if (category === 'random') {
          var film = await getRandomFilm();
          if (film) {
            appendFilms([film]);
          } else {
            showEmptyState('Не удалось загрузить случайный фильм');
          }
        } else if (category === 'favorites') {
          await loadFavorites();
        } else {
          await loadMoreFilms();
        }
      } catch (e) {
        showError('Ошибка загрузки: ' + e.message);
      } finally {
        hideLoader();
      }
    }

    async function loadFavorites() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) {
        showEmptyState('Войдите через Telegram, чтобы видеть коллекцию');
        return;
      }
      try {
        var res = await fetch('/api/my-films', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        var favs = data.favorites || [];
        if (favs.length === 0) {
          showEmptyState('В коллекции пока пусто. Нажмите ❤️ в плеере, чтобы добавить фильм.');
          return;
        }
        appendFilms(favs.map(function(f) {
          return { filmId: f.filmId, nameRu: f.title, year: '—', rating: 'Н/Д' };
        }));
      } catch (e) {
        showError('Ошибка: ' + e.message);
      }
    }

    async function loadMoreFilms() {
      if (isLoading || !hasMore || !currentCategory) return;
      if (currentCategory === 'favorites' || currentCategory === 'random') return;
      isLoading = true;
      showLoader();
      try {
        var films = [];
        if (currentCategory === 'popular') films = await getPopular(currentPage);
        else if (currentCategory === 'top250') films = await getTop250(currentPage);
        else if (currentCategory === 'new') films = await getNew(currentPage);

        if (films.length > 0) {
          currentPage++;
          appendFilms(films);
        } else {
          hasMore = false;
          if (filmGrid.children.length === 0) showEmptyState('Больше нет фильмов');
        }
      } catch (e) {
        showError('Ошибка: ' + e.message);
      } finally {
        isLoading = false;
        hideLoader();
      }
    }

    // ====== Resume card ======
    async function loadResumeCard() {
      var uid = getUserId();
      if (!uid || uid.indexOf('web_') === 0) return;
      try {
        var res = await fetch('/api/last-film', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: getTgInitData(),
            userId: uid
          })
        });
        if (!res.ok) return;
        var data = await res.json();
        if (data && data.film) {
          resumeTitle.textContent = data.film.title || '—';
          var pos = data.film.position || 0;
          var dur = data.film.duration || 0;
          resumeMeta.textContent = formatResumeTime(pos) + (dur ? ' / ' + formatResumeTime(dur) : '');
          if (data.film.filmId) {
            resumePoster.src = '/api/poster?id=' + data.film.filmId + '&size=small';
            resumePoster.style.display = 'block';
          }
          resumeCard.classList.add('visible');
          resumeCard.onclick = function() {
            var t = pos > 5 ? '&t=' + Math.floor(pos) : '';
            window.location.href = '/lite-player.html?id=' + data.film.filmId + '&title=' + encodeURIComponent(data.film.title) + t;
          };
        }
      } catch (e) { console.warn('resume load failed:', e); }
    }

    function formatResumeTime(s) {
      if (!s || s < 0) s = 0;
      s = Math.floor(s);
      var h = Math.floor(s / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      return m + ':' + String(sec).padStart(2, '0');
    }

    // ====== Telegram login redirect handler (URL params from OIDC callback) ======
    // We still parse the redirect params to save the user ID in localStorage,
    // so the user is "logged in" for tracking purposes — but we no longer
    // show any Telegram UI on lite.html itself.
    function handleTgLoginRedirect() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('telegram_login') === 'success') {
        var tgId = params.get('tg_id');
        var tgName = params.get('tg_name');
        var tgUsername = params.get('tg_username');

      }
    }

    // ====== D-pad navigation (for projectors / TV remotes / keyboards) ======
    // Listen for arrow keys, Enter, Escape, Backspace.
    // Maintain a list of focusable elements in DOM order:
    //   hero-title → search-input → action-cards → film-cards
    // This way pressing ArrowDown from hero-title naturally lands on search,
    // then on categories, then on films — exactly what user described.
    function refreshFocusableList() {
      focusableElements = Array.from(document.querySelectorAll(
        '.hero-title, .action-card, .film-card, .resume-card, .search-input, .search-clear'
      )).filter(function(el) {
        return el.offsetParent !== null; // visible
      });
    }

    function getFocusedIndex() {
      var active = document.activeElement;
      for (var i = 0; i < focusableElements.length; i++) {
        if (focusableElements[i] === active) return i;
      }
      return -1;
    }

    function findNearestFocusable(direction) {
      refreshFocusableList();
      if (focusableElements.length === 0) return null;
      var idx = getFocusedIndex();
      if (idx === -1) return focusableElements[0];

      var active = focusableElements[idx];
      var rect = active.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;

      var best = null;
      var bestDist = Infinity;
      for (var i = 0; i < focusableElements.length; i++) {
        if (i === idx) continue;
        var el = focusableElements[i];
        var r = el.getBoundingClientRect();
        var ex = r.left + r.width / 2;
        var ey = r.top + r.height / 2;
        var dx = ex - cx;
        var dy = ey - cy;
        // Filter by direction
        if (direction === 'up' && dy >= 0) continue;
        if (direction === 'down' && dy <= 0) continue;
        if (direction === 'left' && dx >= 0) continue;
        if (direction === 'right' && dx <= 0) continue;
        // Distance (with vertical bias for left/right, horizontal for up/down)
        var dist;
        if (direction === 'up' || direction === 'down') {
          dist = Math.abs(dy) + Math.abs(dx) * 2;
        } else {
          dist = Math.abs(dx) + Math.abs(dy) * 2;
        }
        if (dist < bestDist) {
          bestDist = dist;
          best = el;
        }
      }
      return best;
    }

    function setupKeyboardNav() {
      // Track whether focus was changed by mouse click or keyboard.
      // This helps us decide whether to show focus ring on the next
      // keyboard interaction.
      var lastInputWasMouse = false;

      // On any mousedown, mark that input was via mouse
      document.addEventListener('mousedown', function(e) {
        lastInputWasMouse = true;
        // Find closest focusable element to the click target
        var target = e.target.closest('button, a, input, [tabindex], .action-card, .film-card, .hero-title, .resume-card');
        if (target) {
          // Force focus on the clicked element — this makes the focus
          // ring visible so user knows where they are
          setTimeout(function() {
            try { target.focus({ preventScroll: false }); } catch (_) { target.focus(); }
            try { target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_) {}
          }, 0);
        }
      });

      // On any keydown, mark that input was via keyboard
      document.addEventListener('keydown', function(e) {
        lastInputWasMouse = false;
      });

      document.addEventListener('keydown', function(e) {
        // If user is typing in search input — only intercept Escape (to blur)
        // and Enter (to blur/done). Arrows move the text cursor as usual.
        if (e.target === searchInput) {
          if (e.key === 'Escape') {
            searchInput.blur();
            e.preventDefault();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            searchInput.blur();
          }
          return;
        }

        var target = null;
        // Also handle Tab key — find next focusable element in DOM order
        if (e.key === 'Tab') {
          // Let Tab work naturally, but scroll the focused element into view
          setTimeout(function() {
            var active = document.activeElement;
            if (active && active !== document.body) {
              try { active.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_) {}
            }
          }, 0);
          return;
        }

        switch (e.key) {
          case 'ArrowUp':    target = findNearestFocusable('up');    break;
          case 'ArrowDown':  target = findNearestFocusable('down');  break;
          case 'ArrowLeft':  target = findNearestFocusable('left');  break;
          case 'ArrowRight': target = findNearestFocusable('right'); break;
          case 'Enter':
          case ' ':
            // Click the currently focused element (button, card, hero-title)
            var active = document.activeElement;
            if (active && typeof active.click === 'function' && active !== document.body) {
              e.preventDefault();
              active.click();
            }
            return;
          case 'Escape':
          case 'Backspace':
            // Back button on Android TV remote usually sends Backspace or Escape.
            // If on a film card or in a category — return to categories view.
            if (currentCategory || filmGrid.children.length > 0) {
              currentCategory = null;
              clearFilms();
              content.classList.add('hidden');
              var cards = actions.querySelectorAll('.action-card');
              cards.forEach(function(c) { c.classList.remove('active'); });
              // Focus first category card
              var firstCard = actions.querySelector('.action-card');
              if (firstCard) firstCard.focus();
              e.preventDefault();
            } else {
              // Already at categories — focus the hero title (top of page)
              if (heroTitle) {
                heroTitle.focus();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                e.preventDefault();
              }
            }
            return;
          default:
            return;
        }
        if (target) {
          target.focus();
          try { target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_) {}
          e.preventDefault();
        }
      });

      // ALSO: when an element receives focus (by any means — mouse click,
      // keyboard tab, programmatic focus), make sure it's scrolled into view.
      // This handles the projector remote case where user clicks somewhere
      // off-screen and we need to scroll to show the focused element.
      document.addEventListener('focus', function(e) {
        var target = e.target;
        if (target && target !== document.body && target.scrollIntoView) {
          // Use setTimeout to avoid jank during the focus change
          setTimeout(function() {
            try { target.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (_) {}
          }, 50);
        }
      }, true);  // capture phase — fires before bubble
    }

    // ====== Cursor-as-focus navigation (for projector remotes) ======
    // On Android projectors, the remote emulates a MOUSE — arrow keys on
    // the remote move the system cursor on screen, not keydown events.
    // To make navigation feel like a TV (where arrows move focus):
    //
    //   1. Hide the system cursor (body.cursor-hidden, cursor: none)
    //   2. Show a small blue ring (.focus-cursor) at the cursor position
    //   3. On mousemove, find the nearest focusable element and focus it
    //   4. The blue focus ring appears on that element
    //   5. When user clicks OK on the remote = mouse click = activates
    //      the focused element
    //
    // This way the user sees the blue ring moving between elements as
    // they move the remote — same UX as a TV, but using the mouse protocol
    // that the projector remote speaks.
    function setupCursorNav() {
      var cursorEl = document.getElementById('focusCursor');
      if (!cursorEl) return;

      // Detect if this is likely a projector/TV (no real touch OR saved
      // as projector). On real touch devices (phones/tablets), don't
      // hide the cursor — users need it for touch input.
      var savedDevice = '';
      try { savedDevice = localStorage.getItem('genopoisk_device_type') || ''; } catch (_) {}
      var isInTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
      if (isInTelegram) return;

      var ua = (navigator.userAgent || '').toLowerCase();
      var isAndroid = ua.indexOf('android') !== -1;
      var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

      // Show cursor-nav mode if:
      //   - User explicitly saved device as projector, OR
      //   - Android device with large screen (likely projector), OR
      //   - Any non-touch device (desktop, TV, projector)
      var shouldEnable = (savedDevice === 'projector') ||
                         (isAndroid && window.innerWidth >= 800) ||
                         (!hasTouch);

      // Also allow forcing via URL param ?cursor=1 or ?cursor=0
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('cursor') === '1') shouldEnable = true;
      if (urlParams.get('cursor') === '0') shouldEnable = false;

      if (!shouldEnable) {
        console.log('[cursor-nav] Disabled (touch device or not projector)');
        return;
      }

      // Enable cursor-hidden mode
      document.body.classList.add('cursor-hidden');
      console.log('[cursor-nav] Enabled — system cursor hidden, focus follows mouse');

      // Throttle mousemove to avoid excessive focus calls
      var lastMoveTime = 0;
      var lastFocusEl = null;

      document.addEventListener('mousemove', function(e) {
        // Move the custom cursor ring to the mouse position
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top = e.clientY + 'px';
        cursorEl.classList.add('visible');

        // Throttle: only process focus changes every 50ms
        var now = Date.now();
        if (now - lastMoveTime < 50) return;
        lastMoveTime = now;

        // Find the nearest focusable element to the cursor position
        var focusables = Array.from(document.querySelectorAll(
          '.hero-title, .action-card, .film-card, .resume-card, .search-input, .search-clear, button, a[href], [tabindex]'
        )).filter(function(el) {
          // Skip hidden elements
          if (el.offsetParent === null && el !== document.activeElement) return false;
          // Skip elements with tabindex="-1" (explicitly not focusable)
          if (el.getAttribute('tabindex') === '-1') return false;
          return true;
        });

        if (focusables.length === 0) return;

        var bestEl = null;
        var bestDist = Infinity;
        for (var i = 0; i < focusables.length; i++) {
          var el = focusables[i];
          var r = el.getBoundingClientRect();
          // Check if cursor is INSIDE this element — if yes, focus it immediately
          if (e.clientX >= r.left && e.clientX <= r.right &&
              e.clientY >= r.top && e.clientY <= r.bottom) {
            bestEl = el;
            bestDist = 0;
            break;
          }
          // Otherwise, find the nearest by center distance
          var cx = r.left + r.width / 2;
          var cy = r.top + r.height / 2;
          var dx = cx - e.clientX;
          var dy = cy - e.clientY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestEl = el;
          }
        }

        // Only focus if it's a different element (avoid re-focusing same one)
        if (bestEl && bestEl !== lastFocusEl && bestEl !== document.activeElement) {
          lastFocusEl = bestEl;
          try { bestEl.focus({ preventScroll: true }); } catch (_) { bestEl.focus(); }
        }
      });

      // Hide custom cursor when mouse leaves the window
      document.addEventListener('mouseleave', function() {
        cursorEl.classList.remove('visible');
      });

      // On click, also make sure the focused element is activated
      // (mousedown already handles this, but add click as backup)
      document.addEventListener('click', function(e) {
        var target = e.target.closest('button, a, input, [tabindex], .action-card, .film-card, .hero-title, .resume-card');
        if (target && target !== document.activeElement) {
          try { target.focus({ preventScroll: true }); } catch (_) { target.focus(); }
        }
      }, true);
    }

    // ====== Infinite scroll (lazy load more pages) ======
    function setupInfiniteScroll() {
      var scrollTimeout;
      window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
          var scrollPos = window.innerHeight + window.scrollY;
          var threshold = document.documentElement.scrollHeight - 800;
          if (scrollPos >= threshold && currentCategory &&
              currentCategory !== 'random' && currentCategory !== 'favorites' &&
              !isLoading && hasMore) {
            loadMoreFilms();
          }
        }, 150);
      }, { passive: true });
    }

    // ====== Event listeners ======
    function setupEventListeners() {
      // Category cards
      actions.querySelectorAll('.action-card').forEach(function(card) {
        card.addEventListener('click', function() {
          loadCategory(card.dataset.cat);
        });
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadCategory(card.dataset.cat);
          }
        });
      });

      // Search input
      searchInput.addEventListener('input', function(e) {
        var val = e.target.value.trim();
        searchClear.classList.toggle('visible', val.length > 0);
        clearTimeout(searchTimeout);
        if (!val || val.length < 2) {
          // Too short — show categories
          if (!currentCategory) {
            content.classList.add('hidden');
            clearFilms();
          }
          return;
        }
        searchTimeout = setTimeout(async function() {
          currentCategory = null;
          currentPage = 1;
          hasMore = false;
          clearFilms();
          content.classList.remove('hidden');
          showLoader();
          trackEvent('searches', { query: val });
          try {
            var films = await searchFilms(val);
            appendFilms(films);
          } catch (e) {
            showError('Ошибка поиска: ' + e.message);
          } finally {
            hideLoader();
          }
        }, 250);
      });

      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchInput.blur();
        }
      });

      searchClear.addEventListener('click', function() {
        searchInput.value = '';
        searchClear.classList.remove('visible');
        currentCategory = null;
        clearFilms();
        content.classList.add('hidden');
        searchInput.focus();
      });

      // Resume card close
      resumeClose.addEventListener('click', function(e) {
        e.stopPropagation();
        resumeCard.classList.remove('visible');
        sessionStorage.setItem('genopoisk_resume_dismissed', '1');
      });

      // Hero title click — cycle themes + show toast feedback
      heroTitle.addEventListener('click', function() {
        var themes = ['dark', 'light', 'night'];
        var labels = { dark: '🌙 Тёмная', light: '☀️ Светлая', night: '🌌 Ночная' };
        var current = localStorage.getItem('genopoisk_theme') || 'dark';
        var idx = themes.indexOf(current);
        var next = themes[(idx + 1) % themes.length];
        localStorage.setItem('genopoisk_theme', next);
        applyTheme(next);
        // Visual feedback so user knows the click was registered
        showToast(labels[next] || next, 1500);
      });
    }

    // Simple toast notification (creates element on demand)
    var toastTimer = null;
    function showToast(text, duration) {
      var existing = document.getElementById('liteToast');
      if (existing) existing.remove();
      var toast = document.createElement('div');
      toast.id = 'liteToast';
      toast.textContent = text;
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;z-index:9999;pointer-events:none;transition:opacity 0.2s;box-shadow:0 4px 16px rgba(0,0,0,0.4)';
      document.body.appendChild(toast);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, duration || 2000);
    }

    function applyTheme(theme) {
      document.body.style.background = theme === 'light' ? '#f5f5f5' : theme === 'night' ? '#0a0a1a' : '#000';
      document.body.style.color = theme === 'light' ? '#000' : '#f5f5f5';
    }

    // ====== Projector prompt + saved device indicator ======
    // If the device looks like a projector/TV (Android + large screen) but
    // the user hasn't explicitly confirmed yet — show a small prompt asking
    // "Is this a projector?". On "Yes" → save to localStorage so future
    // visits auto-redirect without asking.
    function setupProjectorPrompt() {
      var prompt = document.getElementById('projectorPrompt');
      var btnYes = document.getElementById('promptYes');
      var btnNo = document.getElementById('promptNo');
      var savedIndicator = document.getElementById('savedIndicator');
      if (!prompt) return;

      // Check URL params first — ?device=projector saves immediately
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('device') === 'projector' || urlParams.get('device') === 'tv') {
        try { localStorage.setItem('genopoisk_device_type', 'projector'); } catch (_) {}
        if (savedIndicator) savedIndicator.style.display = 'inline-block';
        // Clean URL
        try { window.history.replaceState({}, document.title, '/lite.html'); } catch (_) {}
        return;
      }

      // Check if already saved as projector
      var savedDevice = '';
      try { savedDevice = localStorage.getItem('genopoisk_device_type') || ''; } catch (_) {}
      if (savedDevice === 'projector') {
        if (savedIndicator) savedIndicator.style.display = 'inline-block';
        return;
      }

      // Check if user already dismissed the prompt (per session)
      var promptDismissed = '';
      try { promptDismissed = sessionStorage.getItem('genopoisk_projector_prompt_dismissed'); } catch (_) {}
      if (promptDismissed === '1') return;

      // Don't show inside Telegram Mini App
      var isInTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
      if (isInTelegram) return;

      // Heuristic: should we ask? Yes if:
      //   - UA contains Android (any version)
      //   - OR screen is very large (>= 1920px)
      //   - OR no touch support
      var ua = (navigator.userAgent || '').toLowerCase();
      var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      var isAndroid = ua.indexOf('android') !== -1;
      var isLarge = window.innerWidth >= 1024;
      var shouldAsk = isAndroid || (isLarge && !hasTouch);

      if (!shouldAsk) return;

      // Show prompt after 2 seconds (let user see the page first)
      setTimeout(function() {
        prompt.classList.add('visible');
      }, 2000);

      btnYes.addEventListener('click', function() {
        try { localStorage.setItem('genopoisk_device_type', 'projector'); } catch (_) {}
        prompt.classList.remove('visible');
        if (savedIndicator) savedIndicator.style.display = 'inline-block';
        console.log('[lite] Device saved as projector');
      });

      btnNo.addEventListener('click', function() {
        try {
          localStorage.setItem('genopoisk_device_type', 'desktop');
          sessionStorage.setItem('genopoisk_projector_prompt_dismissed', '1');
        } catch (_) {}
        prompt.classList.remove('visible');
        console.log('[lite] Device saved as desktop');
      });
    }

    // ====== Init ======
    function init() {
      handleTgLoginRedirect();
      applyTheme(localStorage.getItem('genopoisk_theme') || 'dark');
      setupEventListeners();
      setupKeyboardNav();
      setupCursorNav();
      setupInfiniteScroll();
      setupProjectorPrompt();
      bustServiceWorkerCache();

      // Telegram WebApp setup
      if (window.Telegram && window.Telegram.WebApp) {
        var tg = window.Telegram.WebApp;
        if (tg.ready) tg.ready();
        if (tg.expand) tg.expand();
      }

      // Load resume card + premium status (async, don't block render)
      loadResumeCard();
      checkPremiumStatus();

      // Auto-focus the hero title on page load — this is the entry point
      // for navigation. User can then:
      //   - Press Tab (or Arrow Down) to move to search
      //   - Click anywhere with mouse (projector remote cursor) — clicked
      //     element receives focus, visible ring shows where focus is
      // We always auto-focus on lite.html (it's specifically for projectors
      // and TVs). The visible focus ring is essential for non-touch devices.
      setTimeout(function() {
        var isInTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
        if (!isInTelegram && heroTitle) {
          heroTitle.focus();
          console.log('[lite] Auto-focused hero title');
        }
      }, 400);
    }

    // ====== Service Worker cache busting ======
    // Bump SW version detection — if /sw.js version changed since last visit,
    // unregister all SWs and clear caches so the new code takes over immediately.
    function bustServiceWorkerCache() {
      if (!('serviceWorker' in navigator)) return;
      fetch('/sw.js', { cache: 'no-store' })
        .then(function(res) { return res.ok ? res.text() : null; })
        .then(function(text) {
          if (!text) return;
          var m = text.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
          if (!m) return;
          var currentVersion = m[1];
          var lastSeen = localStorage.getItem('genopoisk_sw_version_seen');
          if (lastSeen && lastSeen !== currentVersion) {
            console.log('[sw-bust] SW version changed:', lastSeen, '→', currentVersion);
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
          }
          localStorage.setItem('genopoisk_sw_version_seen', currentVersion);
        })
        .catch(function() {});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
